
<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>BIGO LIVE | Livestream Pro</title>

<style>
:root {
  --gold: #ead0a0;
  --line: rgba(226,188,123,.3);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: #090a0e;
  color: #f5e8d2;
  font-family: system-ui, sans-serif;
}

body {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px))
           12px 12px;
  background: #16171c;
  border-bottom: 1px solid var(--line);
}

.back {
  color: var(--gold);
  text-decoration: none;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.title {
  flex: 1;
  min-width: 0;
}

h1 {
  font-size: 17px;
  margin: 0;
  color: var(--gold);
}

.subtitle {
  font-size: 11px;
  color: #b9a88b;
  margin-top: 5px;
}

main {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #000;
}

#bigoFrame {
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

footer {
  padding: 12px 12px
    calc(12px + env(safe-area-inset-bottom,0px));
  background: #15161b;
  border-top: 1px solid var(--line);
  text-align: center;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.action {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #26211b;
  color: var(--gold);
  padding: 12px;
  text-decoration: none;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

.action.primary {
  background: linear-gradient(
    135deg,#f2dab2,#bc9357
  );
  color: #291c0e;
}

.note {
  color: #aa9c86;
  font-size: 11px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>

  <a href="/lobby.html" class="back">
    EXIT
  </a>

  <div class="title">
    <h1 id="roomTitle">BIGO LIVE</h1>

    <div class="subtitle">
      <span id="viewerCount">0</span>
      viewers on Livestream Pro
    </div>
  </div>

</header>

<main>

  <iframe
    id="bigoFrame"
    title="BIGO LIVE Player"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen>
  </iframe>

</main>

<footer>

  <div class="actions">

    <a
      id="openBigo"
      class="action primary"
      href="https://www.bigo.tv/692057933"
      target="_blank"
      rel="noopener noreferrer">
      OPEN ON BIGO
    </a>

    <button
      type="button"
      class="action"
      id="retryPlayer">
      RETRY PLAYER
    </button>

  </div>

  <div class="note">
    If playback is blocked,
    open the livestream on BIGO.
  </div>

</footer>

<script src="/socket.io/socket.io.js"></script>

<script>
(() => {
  "use strict";

  const ROOM_ID = "Bigo692057933";

  const BIGO_URL =
    "https://www.bigo.tv/692057933";

  const params =
    new URLSearchParams(location.search);

  if (params.get("room") !== ROOM_ID) {
    location.replace("/lobby.html");
    return;
  }

  const frame =
    document.getElementById("bigoFrame");

  const countEl =
    document.getElementById("viewerCount");

  const titleEl =
    document.getElementById("roomTitle");

  const openBtn =
    document.getElementById("openBigo");

  const retryBtn =
    document.getElementById("retryPlayer");

  // BIGO may prevent iframe embedding.
  // Direct opening remains available.

  function loadPlayer() {
    frame.src = BIGO_URL;
  }

  openBtn.href = BIGO_URL;

  retryBtn.addEventListener("click", () => {
    frame.src = "about:blank";
    setTimeout(loadPlayer, 100);
  });

  loadPlayer();

  // Get room details from server.

  fetch(
    "/api/virtual-live/rooms/" +
    encodeURIComponent(ROOM_ID),
    { cache: "no-store" }
  )
  .then(response => {
    if (!response.ok) {
      throw new Error("Room unavailable");
    }
    return response.json();
  })
  .then(room => {
    titleEl.textContent =
      room.title || "BIGO LIVE";
  })
  .catch(console.error);

  // Real visitor count inside Livestream Pro.

  if (typeof io !== "function") {
    console.error("Socket.IO unavailable");
    return;
  }

  const socket = io({
    reconnection: true
  });

  function joinRoom() {
    socket.emit(
      "virtual-live:join",
      { roomId: ROOM_ID },
      response => {
        if (!response?.ok) {
          console.warn(
            "Join failed:",
            response?.error
          );
        }
      }
    );
  }

  socket.on("connect", joinRoom);

  socket.on("virtual-live:counts", counts => {
    countEl.textContent = String(
      Math.max(
        0,
        Number(counts?.[ROOM_ID]) || 0
      )
    );
  });

  window.addEventListener("pagehide", () => {
    socket.emit("virtual-live:leave");
    socket.disconnect();
  });

  window.addEventListener("pageshow", event => {
    if (event.persisted && !socket.connected) {
      socket.connect();
    }
  });

})();
</script>

</body>
</html>
