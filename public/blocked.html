<style>
/* ==========================================
   LIVESTREAM PRO
   CHAMPAGNE GOLD BLOCKED V1.0
========================================== */

:root {
  color-scheme: light;

  --bg: #FAF6E9;
  --panel: #FFFFFF;
  --cream: #FCFAF5;
  --champagne: #F8EBC9;

  --gold: #947025;
  --gold-light: #70531D;

  --text: #29251D;
  --muted: #857960;
  --line: #EAE0C8;

  --red: #C95353;
  --green: #32975A;
  --blue: #397FB9;

  --gradient:
    linear-gradient(135deg,#F5E4B5,#E3C47C);

  --shadow:
    0 4px 16px rgba(112,85,28,.06);
}


/* ==========================================
   01. GLOBAL RESET
========================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;

  margin: 0;
  padding: 0;

  background: var(--bg);
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  color: var(--text);

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

.hidden,
[hidden] {
  display: none !important;
}


/* ==========================================
   02. SVG ICONS
========================================== */

.bi {
  display: block;

  width: 20px;
  height: 20px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;

  stroke-linecap: round;
  stroke-linejoin: round;

  flex-shrink: 0;
}


/* ==========================================
   03. MAIN CONTAINER
========================================== */

.blocked-app {
  position: relative;

  width: 100%;
  max-width: 430px;

  min-height: 100vh;
  min-height: 100dvh;

  margin: 0 auto;

  padding-bottom:
    calc(25px + env(safe-area-inset-bottom,0px));

  background: var(--bg);
}


/* ==========================================
   04. HEADER
========================================== */

.block-header {
  position: sticky;

  top: 0;
  z-index: 40;

  padding:
    calc(8px + env(safe-area-inset-top,0px))
    14px
    8px;

  background:
    linear-gradient(120deg,#FFFDF7,#F8EBC9);

  border: none;

  box-shadow: none;
}

.block-header-row {
  display: grid;

  grid-template-columns:
    42px minmax(0,1fr) 42px;

  align-items: center;

  gap: 10px;

  height: 58px;
}


/* BACK BUTTON */

.block-back {
  display: grid;
  place-items: center;

  width: 42px;
  height: 42px;

  margin: 0;
  padding: 0;

  border: 1px solid var(--line);
  border-radius: 12px;

  background: #FFFFFF;
  color: var(--gold);

  box-shadow: none;

  transition: transform .15s;
}

.block-back .bi {
  width: 23px;
  height: 23px;
}

.block-back:active {
  transform: scale(.96);
}


/* HEADER TITLE */

.block-heading {
  display: flex;
  align-items: center;
  justify-content: center;

  min-width: 0;

  text-align: center;
}

.block-heading h1 {
  margin: 0;

  color: var(--text);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 24px;
  font-weight: 700;

  line-height: 1.3;
}


/* REMOVE UNNECESSARY DECORATIONS */

.block-brand,
.block-heading-line,
.intro-kicker,
.block-header::after,
.block-intro::after {
  display: none;
}


/* ==========================================
   05. CONTENT
========================================== */

.block-content {
  width: 100%;

  padding: 14px 13px 20px;
}


/* ==========================================
   06. BLOCKED OVERVIEW
========================================== */

.block-intro {
  position: relative;

  width: 100%;

  padding: 13px;

  border: 1px solid var(--line);
  border-radius: 16px;

  background: #FFFFFF;

  box-shadow: var(--shadow);
}

.intro-main {
  display: flex;
  align-items: center;

  gap: 11px;
}

.intro-icon {
  display: grid;
  place-items: center;

  width: 46px;
  height: 46px;

  flex-shrink: 0;

  border: 1px solid #F0D2CC;
  border-radius: 12px;

  background: #FFF1EF;
  color: var(--red);
}

.intro-icon .bi {
  width: 25px;
  height: 25px;
}

.intro-text {
  flex: 1;
  min-width: 0;
}

.intro-title {
  margin: 0;

  color: var(--text);

  font-size: 14px;
  font-weight: 750;

  line-height: 1.4;
}

.intro-desc {
  margin-top: 4px;

  color: var(--muted);

  font-size: 11px;
  line-height: 1.5;
}


/* TOTAL BLOCKED */

.intro-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin-top: 12px;
  padding-top: 11px;

  border-top: 1px solid var(--line);
}

.intro-bottom > span {
  color: var(--muted);

  font-size: 12px;
}

.block-count {
  display: inline-flex;
  align-items: center;

  gap: 5px;

  color: var(--gold);

  font-size: 23px;
  font-weight: 800;

  font-variant-numeric: tabular-nums;
}

.block-count .bi {
  display: none;
}


/* ==========================================
   07. SEARCH BAR
========================================== */

.block-search {
  width: 100%;

  margin-top: 14px;
}

.search-box {
  display: flex;
  align-items: center;

  width: 100%;
  height: 45px;

  gap: 10px;

  padding: 0 13px;

  border: 1px solid var(--line);
  border-radius: 13px;

  background: #FFFFFF;

  box-shadow: none;

  transition:
    border-color .18s,
    box-shadow .18s;
}

.search-box:focus-within {
  border-color: #C9A75D;

  box-shadow:
    0 0 0 3px rgba(201,167,93,.12);
}

.search-box .bi {
  width: 19px;
  height: 19px;

  color: var(--gold);
}

.search-box input {
  flex: 1;

  width: 100%;
  min-width: 0;
  height: 100%;

  margin: 0;
  padding: 0;

  border: none;
  outline: none;

  background: transparent;
  color: var(--text);

  font-size: 16px;

  -webkit-appearance: none;
  appearance: none;
}

.search-box input::placeholder {
  color: #928A7C;

  font-size: 13px;

  opacity: 1;
}


/* ==========================================
   08. SECTION TITLE
========================================== */

.block-section-title {
  display: flex;
  align-items: center;

  gap: 8px;

  margin: 21px 0 11px;
  padding: 0 3px;
}

.block-section-title .bi {
  width: 19px;
  height: 19px;

  color: var(--gold);
}

.block-section-title h2 {
  flex: 1;

  margin: 0;

  color: var(--text);

  font-size: 16px;
  font-weight: 750;
}

.block-section-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 27px;
  height: 24px;

  padding: 0 8px;

  border: none;
  border-radius: 20px;

  background: var(--champagne);
  color: var(--gold);

  font-size: 11px;
  font-weight: 750;

  font-variant-numeric: tabular-nums;
}


/* ==========================================
   09. BLOCKED USER LIST
========================================== */

#blockList {
  display: grid;

  gap: 8px;
}

.block-row {
  display: grid;

  grid-template-columns:
    48px minmax(0,1fr) auto;

  align-items: center;

  gap: 11px;

  min-width: 0;
  min-height: 73px;

  padding: 10px;

  border: 1px solid var(--line);
  border-radius: 15px;

  background: #FFFFFF;

  box-shadow: var(--shadow);
}


/* ==========================================
   10. AVATAR
========================================== */

.block-avatar {
  display: grid;
  place-items: center;

  width: 48px;
  height: 48px;

  padding: 0;

  overflow: hidden;

  border: 2px solid #E8D7AC;
  border-radius: 50%;

  background: var(--champagne);
  color: var(--gold);
}

.block-avatar img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 50%;
}

.block-avatar .bi {
  width: 24px;
  height: 24px;
}


/* ==========================================
   11. USER INFORMATION
========================================== */

.block-info {
  min-width: 0;
}

.block-name {
  display: flex;
  align-items: center;

  min-width: 0;

  gap: 4px;

  color: var(--text);

  font-size: 14px;
  font-weight: 700;

  line-height: 1.35;
}

.block-name-text {
  min-width: 0;

  overflow-wrap: anywhere;
}

.block-name .verified {
  display: inline-flex;

  flex-shrink: 0;

  color: var(--blue);
}

.block-name .verified .bi {
  width: 15px;
  height: 15px;
}


/* LEVEL */

.block-level {
  display: inline-flex;
  align-items: center;

  gap: 4px;

  margin-top: 5px;
  padding: 0;

  border: none;

  background: transparent;
  color: var(--gold);

  font-size: 11px;
  font-weight: 650;
}

.block-level .bi {
  width: 13px;
  height: 13px;
}


/* Không cần lặp lại chữ Blocked
   vì toàn bộ danh sách là tài khoản bị chặn */

.block-status {
  display: none;
}


/* ==========================================
   12. UNBLOCK BUTTON
========================================== */

.block-actions {
  display: flex;
  align-items: center;
}

.btn-unblock {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;

  gap: 5px;

  min-width: 85px;
  min-height: 42px;

  padding: 8px 10px;

  border: 1px solid #E5D1A0;
  border-radius: 10px;

  background: #F8F0DB;
  color: var(--gold);

  font-size: 11px;
  font-weight: 700;

  box-shadow: none;

  transition:
    transform .15s,
    background .15s;
}

.btn-unblock .bi {
  width: 17px;
  height: 17px;

  color: currentColor;
}

.btn-unblock:active {
  transform: scale(.96);
}


/* ==========================================
   13. EMPTY STATE
========================================== */

.block-empty {
  padding: 28px 18px;

  border: 1px dashed #E1D4B7;
  border-radius: 16px;

  background: rgba(255,255,255,.65);

  color: var(--muted);

  font-size: 13px;

  text-align: center;
}

.empty-icon {
  display: grid;
  place-items: center;

  width: 57px;
  height: 57px;

  margin: 0 auto 13px;

  border: 1px solid #E5D1A0;
  border-radius: 50%;

  background: var(--champagne);
  color: var(--gold);
}

.empty-icon .bi {
  width: 27px;
  height: 27px;
}

.empty-title {
  color: var(--text);

  font-size: 15px;
  font-weight: 700;
}

.empty-desc {
  margin-top: 7px;

  color: var(--muted);

  font-size: 12px;

  line-height: 1.6;
}


/* ==========================================
   14. CONFIRMATION MODAL
========================================== */

.block-modal {
  position: fixed;
  inset: 0;

  z-index: 500;

  display: none;
  align-items: center;
  justify-content: center;

  padding:
    calc(18px + env(safe-area-inset-top,0px))
    18px
    calc(18px + env(safe-area-inset-bottom,0px));
}

.block-modal.show {
  display: flex;
}

.block-modal-overlay,
.fl-backdrop {
  position: absolute;
  inset: 0;

  background: rgba(52,43,25,.28);

  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.block-modal-box {
  position: relative;

  z-index: 1;

  width: 100%;
  max-width: 350px;
  max-height: 100%;

  padding: 25px 20px 20px;

  overflow-y: auto;

  border: 1px solid var(--line);
  border-radius: 23px;

  background: #FFFFFF;

  box-shadow:
    0 18px 60px rgba(85,65,25,.16);

  text-align: center;

  animation: blockModalIn .2s ease-out;
}


/* MODAL ICON */

.modal-icon {
  display: grid;
  place-items: center;

  width: 60px;
  height: 60px;

  margin: 0 auto 15px;

  border: 1px solid #E5D1A0;
  border-radius: 18px;

  background: var(--champagne);
  color: var(--gold);
}

.modal-icon .bi {
  width: 28px;
  height: 28px;
}


/* MODAL TEXT */

.modal-title {
  color: var(--text);

  font-size: 21px;
  font-weight: 750;

  line-height: 1.35;
}

.modal-desc {
  margin-top: 11px;

  color: var(--muted);

  font-size: 13px;
  line-height: 1.65;

  overflow-wrap: anywhere;
}


/* MODAL BUTTONS */

.modal-buttons {
  display: grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap: 9px;

  margin-top: 20px;
  padding-top: 16px;

  border-top: 1px solid var(--line);
}

.modal-btn {
  min-height: 45px;

  padding: 9px;

  border-radius: 12px;

  font-size: 13px;
  font-weight: 750;

  transition: transform .15s;
}

.modal-cancel {
  border: 1px solid var(--line);

  background: #FFFFFF;
  color: var(--gold);
}

.modal-confirm {
  border: 1px solid #DFC382;

  background: var(--gradient);
  color: #4D3915;
}

.modal-btn:active {
  transform: scale(.97);
}

@keyframes blockModalIn {
  from {
    opacity: 0;
    transform: scale(.97);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}


/* ==========================================
   15. TOAST NOTIFICATIONS
========================================== */

#toast-container {
  position: fixed;

  z-index: 1000;

  top:
    calc(12px + env(safe-area-inset-top,0px));

  left: 12px;
  right: 12px;

  display: grid;
  justify-items: center;

  gap: 8px;

  pointer-events: none;
}

.toast {
  display: flex;
  align-items: center;

  width: 100%;
  max-width: 400px;

  gap: 9px;

  padding: 13px;

  border: 1px solid var(--line);
  border-radius: 13px;

  background: #FFFFFF;
  color: var(--text);

  font-size: 13px;

  box-shadow:
    0 8px 25px rgba(85,65,25,.12);
}

.toast-message {
  min-width: 0;

  overflow-wrap: anywhere;
}

.toast .bi {
  color: var(--gold);
}

.toast.success {
  border-color: #C7E5CF;
}

.toast.success .bi {
  color: var(--green);
}

.toast.error {
  border-color: #F0D2CC;
}

.toast.error .bi {
  color: var(--red);
}


/* ==========================================
   16. FORCE LOGOUT MODAL
========================================== */

#forceLogoutModal {
  position: fixed;
  inset: 0;

  z-index: 2000;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 18px;
}

#forceLogoutModal.show {
  display: flex;
}

.fl-box {
  position: relative;

  width: 100%;
  max-width: 350px;

  padding: 27px 20px;

  border: 1px solid var(--line);
  border-radius: 23px;

  background: #FFFFFF;

  box-shadow:
    0 18px 60px rgba(85,65,25,.16);

  text-align: center;
}

.fl-icon {
  display: grid;
  place-items: center;

  width: 62px;
  height: 62px;

  margin: 0 auto 16px;

  border-radius: 50%;

  background: #FFF1EF;
  color: var(--red);
}

.fl-icon .bi {
  width: 30px;
  height: 30px;
}

.fl-title {
  margin: 0 0 10px;

  color: var(--text);

  font-size: 21px;
  font-weight: 750;
}

.fl-msg,
.fl-sub {
  color: var(--muted);

  font-size: 13px;
  line-height: 1.6;

  overflow-wrap: anywhere;
}

.fl-sub {
  margin-top: 10px;

  font-size: 12px;
}


/* ==========================================
   17. RESPONSIVE MOBILE
========================================== */

@media (max-width: 375px) {

  .block-header {
    padding-left: 11px;
    padding-right: 11px;
  }

  .block-content {
    padding-left: 10px;
    padding-right: 10px;
  }

  .block-heading h1 {
    font-size: 21px;
  }

  .block-row {
    grid-template-columns:
      43px minmax(0,1fr) auto;

    gap: 8px;

    padding: 9px;

    min-height: 67px;
  }

  .block-avatar {
    width: 43px;
    height: 43px;
  }

  .block-name {
    font-size: 13px;
  }

  .btn-unblock {
    min-width: 75px;
    min-height: 40px;

    padding: 7px;
    gap: 4px;

    font-size: 10px;
  }

  .btn-unblock .bi {
    width: 15px;
    height: 15px;
  }

}

@media (max-width: 320px) {

  .block-heading h1 {
    font-size: 18px;
  }

  .block-row {
    grid-template-columns:
      40px minmax(0,1fr) auto;

    gap: 7px;
  }

}


/* ==========================================
   18. REDUCED MOTION
========================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }

}

</style>

</head>

  <!-- HEADER -->
  <header class="block-header">

 <div class="block-heading">

    </div>

    <!-- LIST TITLE -->
    <div class="block-section-title">
      <svg class="bi">
        <use href="#bk-shield"></use>
      </svg>

      <h2>Blocked List</h2>

      <span class="block-section-count"
            id="visibleBlockedCount">0</span>
    </div>

    <!-- LIST -->
    <div id="blockList">
      <div class="block-empty">
        <div class="empty-title">Loading...</div>
      </div>
    </div>

  </main>
</div>

<!-- ===== CONFIRM MODAL ===== -->

<div id="unblockModal"
     class="block-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="unblockTitle">

  <div class="block-modal-overlay"
       onclick="closeUnblockModal()"></div>

  <div class="block-modal-box">

    <div class="modal-icon">
      <svg class="bi">
        <use href="#bk-unlock"></use>
      </svg>
    </div>

<div class="modal-title" id="unblockTitle">
  Unblock User?
</div>

    <div class="modal-desc" id="unblockMessage"></div>

    <div class="modal-buttons">

<button type="button"
        class="modal-btn modal-cancel"
        onclick="closeUnblockModal()">
  Cancel
</button>

<button type="button"
        class="modal-btn modal-confirm"
        id="confirmUnblockBtn">
  Unblock
</button>

    </div>

  </div>
</div>

<div id="toast-container" aria-live="polite"></div>

<script src="/push-init.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/app-entry-guard.js"></script>

<script>
/* =========================================
   BLOCKED PAGE - JAVASCRIPT
========================================= */

const socket = io();

const profile = JSON.parse(
  localStorage.getItem("user_profile") || "{}"
);

if (!profile.uid) {
  location.href = "/login.html";
}

let blockedUsers = [];
let selectedUnblock = null;



/* ==========================================
   BLOCKED - SMOOTH PAGE NAVIGATION
========================================== */

function navigateBlocked(url, label = "Loading Page...") {

  if (window.LSPTransition?.go) {

    LSPTransition.go(url, {
      label: label
    });

  } else {

    window.location.href = url;

  }

}



/* ===== ICON ===== */

function blockIcon(name) {
  return `
    <svg class="bi" aria-hidden="true">
      <use href="#bk-${name}"></use>
    </svg>
  `;
}

/* ===== AUTH ===== */

socket.on("connect", () => {
  if (profile.uid) {
    socket.emit("auth-login", {
      uid: profile.uid
    });
  }
});

/* ===== BACK ===== */


/* ==========================================
   BLOCKED -> FRIENDS
========================================== */

function goBlockedBack() {

  navigateBlocked(
    "/friends.html",
    "Opening Friends..."
  );

}


/* ===== SAFE AVATAR ===== */

function blockedAvatarUrl(value) {
  if (typeof value !== "string" || !value.trim()) {
    return "";
  }

  try {
    const url = new URL(value, location.origin);

    if (url.protocol === "http:" || url.protocol === "https:") {
      return url.href;
    }
  } catch (e) {}

  return "";
}

/* ===== LOAD DANH SÁCH ===== */

async function loadBlocked() {
  if (!profile.uid) return;

  try {
    const response = await fetch(
      "/api/blocked/" + encodeURIComponent(profile.uid),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Unable to load the blocked users list.");
    }

    const data = await response.json();

    blockedUsers = Array.isArray(data.blocked)
      ? data.blocked
      : [];

    document.getElementById("totalBlocked").textContent =
      blockedUsers.length;

    filterBlocked();

  } catch (error) {
    console.error("Lỗi danh sách chặn:", error);

showToast(
  "Failed to load blocked users.",
  "error"
);

    const box = document.getElementById("blockList");

    box.replaceChildren();

    const empty = document.createElement("div");
    empty.className = "block-empty";
    empty.textContent =
  "Unable to load data. Please refresh the page.";

    box.appendChild(empty);
  }
}

/* ===== CREATE USER CARD ===== */

function createBlockedCard(user) {
  const row = document.createElement("div");
  row.className = "block-row";

  row.innerHTML = `
    <div class="block-avatar">
      ${blockIcon("user")}
    </div>

    <div class="block-info">

      <div class="block-name">
        <span class="block-name-text"></span>
      </div>

      <div class="block-level">
        ${blockIcon("gem")}
        <span class="block-level-text"></span>
      </div>


    </div>

<div class="block-actions">

  <button
    class="btn-unblock"
    type="button">

    ${blockIcon("unlock")}

    <span>Unblock</span>

  </button>

</div>
  `;

  const name = String(user.name || "User");
  const uid = String(user.uid || "");

  row.querySelector(".block-name-text").textContent = name;

  row.querySelector(".block-level-text").textContent =
    "Lv " + (Number(user.level) || 1);

  /* VERIFIED */
  if (user.verified) {
    const badge = document.createElement("span");

    badge.className = "verified";
    badge.title = "Verified Account";
    badge.innerHTML = blockIcon("verified");

    row.querySelector(".block-name").appendChild(badge);
  }

  /* AVATAR */
  const src = blockedAvatarUrl(user.avatar);

  if (src) {
    const img = new Image();

    img.alt = "Profile picture of " + name;
    img.loading = "lazy";

    img.onload = () => {
      row.querySelector(".block-avatar")
        ?.replaceChildren(img);
    };

    img.src = src;
  }

  /* ACTION */
  const button = row.querySelector(".btn-unblock");

button.setAttribute(
  "aria-label",
  "Unblock " + name
);

  button.onclick = () => {
    unblock(uid, name);
  };

  return row;
}

/* ===== RENDER ===== */

function renderBlocked(list) {
  const box = document.getElementById("blockList");

  box.replaceChildren();

  document.getElementById("visibleBlockedCount").textContent =
    list.length;

  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "block-empty";

    const hasQuery = document.getElementById(
      "blockedSearchInput"
    ).value.trim().length > 0;

    empty.innerHTML = `
      <div class="empty-icon">
        ${blockIcon("shield-check")}
      </div>
      <div class="empty-title"></div>
      <div class="empty-desc"></div>
    `;

/* ==========================================
   EMPTY BLOCKED LIST - ENGLISH
========================================== */

empty.querySelector(".empty-title").textContent =
  hasQuery
    ? "No results"
    : "No blocked users";

empty.querySelector(".empty-desc").textContent =
  hasQuery
    ? "No blocked users match your search."
    : "You haven't blocked any users yet.";

    box.appendChild(empty);
    return;
  }

  const fragment = document.createDocumentFragment();

  list.forEach(user => {
    fragment.appendChild(createBlockedCard(user));
  });

  box.appendChild(fragment);
}

/* ===== TÌM KIẾM ===== */

function filterBlocked() {
  const keyword = document.getElementById(
    "blockedSearchInput"
  ).value.trim().toLocaleLowerCase("vi-VN");

  if (!keyword) {
    renderBlocked(blockedUsers);
    return;
  }

  const filtered = blockedUsers.filter(user => {
    const name = String(user.name || "")
      .toLocaleLowerCase("vi-VN");

    return name.includes(keyword);
  });

  renderBlocked(filtered);
}

/* ===== UNBLOCK MODAL ===== */

function unblock(uid, name) {
  selectedUnblock = {
    uid: String(uid),
    name: String(name)
  };

document.getElementById("unblockMessage").textContent =
  `Are you sure you want to unblock ${selectedUnblock.name}?`;

  document.getElementById("unblockModal")
    .classList.add("show");

  document.getElementById("confirmUnblockBtn").focus();
}

function closeUnblockModal() {
  document.getElementById("unblockModal")
    .classList.remove("show");

  selectedUnblock = null;
}

/* ===== XÁC NHẬN BỎ CHẶN ===== */

document.getElementById("confirmUnblockBtn")
  .addEventListener("click", () => {

    if (!selectedUnblock) return;

    if (!socket.connected) {
showToast(
  "Connection lost. Please try again.",
  "error"
);
      return;
    }

    const uid = selectedUnblock.uid;

    socket.emit("user-unblock", { uid });

    closeUnblockModal();

showToast(
  "Unblock request sent successfully.",
  "info"
);

    // Làm mới danh sách từ server
    setTimeout(loadBlocked, 500);
  });

/* ===== ESC KEY ===== */

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeUnblockModal();
  }
});

/* =========================================
   SYSTEM NOTIFICATIONS
========================================= */

socket.on("system-notify", data => {
  if (!data) return;

  if (data.type === "topup") {
showToast(
  data.text || "Coins have been added to your account.",
  "success"
);
    return;
  }

  if (data.type === "withdraw") {
    notifyWithdraw(data);
  }

  if (data.type === "lock") {
showToast(
  data.reason || "Your account has been locked.",
  "error"
);

    clearBlockedLogin();

    setTimeout(() => {
      location.href = "/login.html";
    }, 2000);
  }
});

/* ===== TOAST ===== */

function showToast(message, type = "info", timeout = 3500) {
  const box = document.getElementById("toast-container");

  const toast = document.createElement("div");

  toast.className = "toast " + type;

  const iconName =
    type === "success"
      ? "shield-check"
      : type === "error"
      ? "shield"
      : "info";

  toast.innerHTML =
    blockIcon(iconName) +
    `<span class="toast-message"></span>`;

  toast.querySelector(".toast-message").textContent =
    String(message || "");

  box.appendChild(toast);

  setTimeout(() => toast.remove(), timeout);
}

/* ===== WITHDRAW ===== */

function showWithdrawNotify(data) {
  notifyWithdraw(data);
}

function notifyWithdraw(data) {
const text = data?.text ||
  "Coins have been deducted from your account.";

  if (typeof openSysModal === "function") {
    openSysModal(text);
  } else {
    showToast(text, "error", 5000);
  }
}

/* ===== LOGIN CLEANUP ===== */

function clearBlockedLogin() {
  localStorage.removeItem("user_profile");
  localStorage.removeItem("login_uid");
  localStorage.removeItem("isGuest");
}

/* ===== FORCE LOGOUT ===== */

function showForceLogoutModal(message) {
  let modal = document.getElementById(
    "forceLogoutModal"
  );

  if (!modal) {
    modal = document.createElement("div");

    modal.id = "forceLogoutModal";

    modal.innerHTML = `
      <div class="fl-backdrop"></div>

      <div class="fl-box">
        <div class="fl-icon">
          ${blockIcon("shield")}
        </div>

<div class="fl-title">
  Session Ended
</div>
        <div class="fl-msg"></div>

<div class="fl-sub">
  You will be redirected to the login page...
</div>
      </div>
    `;

    document.body.appendChild(modal);
  }

  modal.querySelector(".fl-msg").textContent =
    String(message || "");

  modal.classList.add("show");
}

socket.on("force-logout", data => {
 const message = data?.message ||
  "You have been signed out.";

  showForceLogoutModal(message);

  clearBlockedLogin();

  setTimeout(() => {
    location.href = "/login.html";
  }, 3000);
});

/* ===== INIT ===== */

loadBlocked();

</script>
</body>
</html>
