<style>
/* ==========================================
   LIVESTREAM PRO
   CHAMPAGNE GOLD FRIENDS V1.0
========================================== */

:root {
  color-scheme: light;

  --bg: #FAF6E9;
  --panel: #FFFFFF;
  --cream: #FCFAF5;
  --champagne: #F8EBC9;

  --gold: #947025;
  --light: #29251D;
  --line: #EAE0C8;
  --muted: #857960;

  --red: #C95353;
  --green: #32975A;
  --blue: #397FB9;

  --gradient:
    linear-gradient(135deg,#F5E4B5,#E3C47C);

  --shadow:
    0 4px 16px rgba(112,85,28,.06);
}


/* ==========================================
   01. GLOBAL RESET
========================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;

  margin: 0;
  padding: 0;

  background: var(--bg);
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  color: var(--light);

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button:focus-visible,
[role="button"]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

.hidden,
[hidden] {
  display: none !important;
}

svg {
  display: block;
}

.fi {
  display: block;

  width: 20px;
  height: 20px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;

  flex-shrink: 0;
}


/* ==========================================
   02. MAIN CONTAINER
========================================== */

.friends-app {
  position: relative;

  width: 100%;
  max-width: 430px;

  min-height: 100vh;
  min-height: 100dvh;

  margin: 0 auto;

  padding-bottom:
    calc(90px + env(safe-area-inset-bottom,0px));

  background: var(--bg);
}


/* ==========================================
   03. STICKY HEADER
========================================== */

.friends-top {
  position: sticky;

  top: 0;
  z-index: 40;

  width: 100%;

  padding-top:
    calc(8px + env(safe-area-inset-top,0px));

  background:
    linear-gradient(120deg,#FFFDF7,#F8EBC9);

  border: none;
  box-shadow: none;
}

.friend-header {
  display: grid;

  grid-template-columns:
    42px minmax(0,1fr) 42px;

  align-items: center;

  width: 100%;
  height: 58px;

  padding: 0 14px;

  gap: 10px;
}

.friend-heading {
  grid-column: 2;

  min-width: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
}

.friend-heading h1 {
  margin: 0;

  color: var(--light);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 25px;
  font-weight: 700;

  line-height: 1.3;
}


/* REMOVE UNNECESSARY DECORATION */

.friend-brand,
.friend-heading-line,
.search-end-icon {
  display: none;
}


/* BACK BUTTON */

.header-back {
  grid-column: 1;
}

.header-btn {
  width: 42px;
  height: 42px;

  margin: 0;
  padding: 0;

  display: grid;
  place-items: center;

  border: 1px solid var(--line);
  border-radius: 12px;

  background: #FFFFFF;
  color: var(--gold);

  box-shadow: none;

  transition: transform .15s;
}

.header-btn .fi {
  width: 23px;
  height: 23px;
}


/* ==========================================
   04. SEARCH BAR
========================================== */

.friend-search {
  width: 100%;

  padding: 4px 14px 14px;
}

.search-inner {
  display: flex;
  align-items: center;

  width: 100%;
  height: 45px;

  gap: 10px;

  padding: 0 13px;

  border: 1px solid var(--line);
  border-radius: 13px;

  background: #FFFFFF;

  transition:
    border-color .18s,
    box-shadow .18s;
}

.search-inner:focus-within {
  border-color: #C9A75D;

  box-shadow:
    0 0 0 3px rgba(201,167,93,.12);
}

.search-inner .search-icon {
  width: 19px;
  height: 19px;

  color: var(--gold);
}

.search-inner input {
  flex: 1;

  width: 100%;
  min-width: 0;
  height: 100%;

  margin: 0;
  padding: 0;

  border: none;
  outline: none;

  background: transparent;
  color: var(--light);

  font-size: 16px;

  box-shadow: none;

  -webkit-appearance: none;
  appearance: none;
}

.search-inner input::placeholder {
  color: #928A7C;

  font-size: 13px;

  opacity: 1;
}


/* ==========================================
   05. SECTION HEADINGS
========================================== */

.friend-section {
  padding: 4px 13px 18px;
}

.section-heading {
  display: flex;
  align-items: center;

  gap: 9px;

  margin: 19px 0 10px;
  padding: 0 3px;

  border: none;
  background: transparent;
}

.section-heading .fi {
  width: 20px;
  height: 20px;

  color: var(--gold);
}

.section-heading h2 {
  margin: 0;

  color: var(--light);

  font-size: 16px;
  font-weight: 750;

  line-height: 1.4;
}

.section-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 27px;
  height: 24px;

  margin-left: auto;
  padding: 0 8px;

  border: none;
  border-radius: 20px;

  background: var(--champagne);
  color: var(--gold);

  font-size: 11px;
  font-weight: 750;

  font-variant-numeric: tabular-nums;
}


/* ==========================================
   06. FRIEND CARDS
========================================== */

.friend-row {
  display: grid;

  grid-template-columns:
    48px minmax(0,1fr) auto;

  align-items: center;

  gap: 10px;

  min-width: 0;
  min-height: 73px;

  margin-bottom: 8px;
  padding: 10px;

  border: 1px solid var(--line);
  border-radius: 15px;

  background: #FFFFFF;

  box-shadow: var(--shadow);
}


/* ==========================================
   07. AVATAR
========================================== */

.friend-avatar {
  display: grid;
  place-items: center;

  width: 48px;
  height: 48px;

  padding: 0;

  border: 2px solid #E8D7AC;
  border-radius: 50%;

  background: var(--champagne);

  overflow: hidden;

  cursor: pointer;
}

.friend-avatar img {
  display: block;

  width: 100%;
  height: 100%;

  border-radius: 50%;

  object-fit: cover;
}

.friend-avatar .fi {
  width: 24px;
  height: 24px;

  color: var(--gold);
}


/* ==========================================
   08. FRIEND INFORMATION
========================================== */

.friend-info {
  min-width: 0;

  cursor: pointer;
}

.friend-name {
  display: flex;
  align-items: center;

  gap: 4px;

  min-width: 0;

  color: var(--light);

  font-size: 14px;
  font-weight: 700;

  line-height: 1.35;
}

.friend-name .name-text {
  min-width: 0;

  overflow-wrap: anywhere;
}

.friend-name .verified {
  flex-shrink: 0;

  color: var(--blue);
}

.friend-name .verified .fi {
  width: 15px;
  height: 15px;
}


/* LEVEL */

.friend-level {
  display: inline-flex;
  align-items: center;

  gap: 4px;

  margin-top: 5px;
  padding: 0;

  border: none;
  border-radius: 0;

  background: transparent;
  color: var(--gold);

  font-size: 11px;
  font-weight: 650;
}

.friend-level .fi {
  width: 13px;
  height: 13px;
}


/* ==========================================
   09. COMPACT ACTION BUTTONS
========================================== */

.friend-actions {
  display: flex;
  align-items: center;

  gap: 5px;

  min-width: 0;
}

.action-btn {
  flex: 0 0 auto;

  display: grid;
  place-items: center;

  width: 42px;
  height: 42px;

  margin: 0;
  padding: 0;

  border: 1px solid var(--line);
  border-radius: 10px;

  background: #F8F3E6;
  color: var(--gold);

  box-shadow: none;

  transition:
    background .15s,
    transform .15s;
}

.action-btn .fi {
  width: 19px;
  height: 19px;

  color: currentColor;
}


/* ICON ONLY */

.action-btn .action-label {
  display: none;
}


/* MESSAGE */

.friend-row:not(.request)
.friend-actions .action-btn:first-child {

  background: var(--champagne);

  border-color: #E5D1A0;

  color: var(--gold);
}


/* ACCEPT REQUEST */

.action-btn.accept {
  background: #ECF8EF;
  border-color: #C7E5CF;

  color: var(--green);
}


/* DECLINE / BLOCK */

.action-btn.reject,
.action-btn.block {
  background: #FFF1EF;
  border-color: #F0D2CC;

  color: var(--red);
}

.action-btn:active,
.header-btn:active,
.btn-blocked-fixed:active {
  transform: scale(.96);
}


/* ==========================================
   10. EMPTY STATE
========================================== */

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 8px;

  min-height: 58px;

  padding: 13px;

  border: 1px dashed #E1D4B7;
  border-radius: 13px;

  background: rgba(255,255,255,.55);
  color: var(--muted);

  font-size: 12px;

  text-align: center;
}

.empty-state .fi {
  width: 17px;
  height: 17px;

  color: #AF945E;
}


/* ==========================================
   11. BLOCKED USERS - BOTTOM BUTTON
========================================== */

.bottom-wrap {
  position: fixed;

  z-index: 45;

  left: 50%;
  bottom: 0;

  transform: translateX(-50%);

  width: 100%;
  max-width: 430px;

  padding:
    11px
    max(13px,env(safe-area-inset-right,0px))
    calc(12px + env(safe-area-inset-bottom,0px))
    max(13px,env(safe-area-inset-left,0px));

  background: #FFFFFF;

  border-top: 1px solid var(--line);

  box-shadow:
    0 -4px 18px rgba(112,85,28,.05);

  pointer-events: none;
}

.btn-blocked-fixed {
  pointer-events: auto;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  min-height: 46px;

  gap: 9px;

  margin: 0;
  padding: 10px;

  border: 1px solid #F0D2CC;
  border-radius: 12px;

  background: #FFF1EF;
  color: #B94A42;

  font-size: 13px;
  font-weight: 700;

  box-shadow: none;
}

.btn-blocked-fixed .fi {
  width: 19px;
  height: 19px;
}


/* ==========================================
   12. CONFIRMATION MODAL
========================================== */

.friend-confirm-overlay {
  position: fixed;
  inset: 0;

  z-index: 1050;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    calc(18px + env(safe-area-inset-top,0px))
    18px
    calc(18px + env(safe-area-inset-bottom,0px));
}

.friend-confirm-backdrop,
.fl-backdrop {
  position: absolute;
  inset: 0;

  background: rgba(52,43,25,.28);

  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.friend-confirm-box {
  position: relative;

  z-index: 1;

  width: 100%;
  max-width: 350px;
  max-height: 100%;

  padding: 25px 20px 20px;

  overflow-y: auto;

  border: 1px solid var(--line);
  border-radius: 23px;

  background: #FFFFFF;

  box-shadow:
    0 18px 60px rgba(85,65,25,.16);

  text-align: center;

  animation: friendModalIn .2s ease-out;
}


/* CONFIRM ICON */

.friend-confirm-icon {
  display: grid;
  place-items: center;

  width: 60px;
  height: 60px;

  margin: 0 auto 15px;

  border: 1px solid #E5D1A0;
  border-radius: 18px;

  background: var(--champagne);
  color: var(--gold);
}

.friend-confirm-icon .fi {
  width: 28px;
  height: 28px;
}

.friend-confirm-overlay.is-block
.friend-confirm-icon {

  background: #FFF1EF;
  border-color: #F0D2CC;

  color: var(--red);
}


/* CONFIRM CONTENT */

#friendConfirmTitle {
  margin: 0;

  color: var(--light);

  font-size: 21px;
  font-weight: 750;

  line-height: 1.35;
}

#friendConfirmMessage {
  margin: 11px 0 0;

  color: var(--muted);

  font-size: 13px;
  line-height: 1.65;

  overflow-wrap: anywhere;
}

.friend-confirm-divider {
  width: 100%;
  height: 1px;

  margin: 20px 0 16px;

  background: var(--line);
}


/* CONFIRM BUTTONS */

.friend-confirm-actions {
  display: grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap: 9px;
}

.friend-confirm-actions button {
  min-height: 45px;

  padding: 9px;

  border-radius: 12px;

  font-size: 12px;
  font-weight: 750;
}

.friend-confirm-cancel {
  border: 1px solid var(--line);

  background: #FFFFFF;
  color: var(--gold);
}

.friend-confirm-submit {
  border: 1px solid #DFC382;

  background: var(--gradient);
  color: #4D3915;
}

.friend-confirm-overlay.is-block
.friend-confirm-submit {

  border: 1px solid #BF5151;

  background: #C95353;
  color: #FFFFFF;
}

@keyframes friendModalIn {
  from {
    opacity: 0;
    transform: scale(.97);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}


/* ==========================================
   13. TOAST NOTIFICATIONS
========================================== */

#toast-container {
  position: fixed;

  z-index: 1001;

  top:
    calc(12px + env(safe-area-inset-top,0px));

  left: 12px;
  right: 12px;

  display: grid;
  justify-items: center;

  gap: 8px;

  pointer-events: none;
}

.toast {
  pointer-events: auto;

  display: flex;
  align-items: center;

  width: 100%;
  max-width: 400px;

  gap: 9px;

  padding: 13px;

  border: 1px solid var(--line);
  border-radius: 13px;

  background: #FFFFFF;
  color: var(--light);

  font-size: 13px;

  box-shadow:
    0 8px 25px rgba(85,65,25,.12);
}

.toast .msg {
  min-width: 0;

  overflow-wrap: anywhere;
}

.toast .fi {
  color: var(--gold);
}

.toast.success {
  border-color: #C7E5CF;
}

.toast.success .fi {
  color: var(--green);
}

.toast.error {
  border-color: #F0D2CC;
}

.toast.error .fi {
  color: var(--red);
}


/* ==========================================
   14. FORCE LOGOUT MODAL
========================================== */

#forceLogoutModal {
  position: fixed;
  inset: 0;

  z-index: 1100;

  display: none;
  place-items: center;

  padding: 18px;
}

#forceLogoutModal.show {
  display: grid;
}

.fl-box {
  position: relative;

  width: 100%;
  max-width: 350px;

  padding: 27px 20px;

  border: 1px solid var(--line);
  border-radius: 23px;

  background: #FFFFFF;

  box-shadow:
    0 18px 60px rgba(85,65,25,.16);

  text-align: center;
}

.fl-icon {
  display: grid;
  place-items: center;

  width: 62px;
  height: 62px;

  margin: 0 auto 16px;

  border-radius: 50%;

  background: #FFF1EF;
  color: var(--red);
}

.fl-icon .fi {
  width: 30px;
  height: 30px;
}

.fl-title {
  margin-bottom: 9px;

  color: var(--light);

  font-size: 21px;
  font-weight: 750;
}

.fl-msg,
.fl-sub {
  color: var(--muted);

  font-size: 13px;
  line-height: 1.6;

  overflow-wrap: anywhere;
}

.fl-sub {
  margin-top: 10px;

  font-size: 12px;
}


/* ==========================================
   15. RESPONSIVE MOBILE
========================================== */

@media (max-width: 375px) {

  .friend-header {
    padding-left: 11px;
    padding-right: 11px;
  }

  .friend-search {
    padding-left: 11px;
    padding-right: 11px;
  }

  .friend-section {
    padding-left: 10px;
    padding-right: 10px;
  }

  .friend-row {
    grid-template-columns:
      43px minmax(0,1fr) auto;

    gap: 7px;

    padding: 9px;

    min-height: 67px;
  }

  .friend-avatar {
    width: 43px;
    height: 43px;
  }

  .friend-actions {
    gap: 4px;
  }

  .action-btn {
    width: 38px;
    height: 40px;
  }

  .action-btn .fi {
    width: 17px;
    height: 17px;
  }

  .friend-name {
    font-size: 13px;
  }

}

@media (max-width: 320px) {

  .friend-row {
    grid-template-columns:
      40px minmax(0,1fr);

    row-gap: 9px;
  }

  .friend-actions {
    grid-column: 1/-1;
    justify-content: flex-end;
  }

}


/* ==========================================
   16. REDUCED MOTION
========================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }

}

</style>


</head>

      <span class="section-count" id="requestCount">0</span>
    </div>
    <div id="reqList"></div>

    <div class="section-heading">
      <svg class="fi"><use href="#f-users"/></svg>
      <h2>My Friends</h2>
      <span class="section-count" id="friendCount">0</span>
    </div>
    <div id="friendList"></div>
  </main>
</div>


<!-- ==========================================
     BLOCKED USERS BUTTON
     ENGLISH INTERFACE
========================================== -->

<div class="bottom-wrap">

  <button
    type="button"
    class="btn-blocked-fixed"
    data-lsp-href="/blocked.html"
    data-lsp-label="Opening Blocked Users..."
    aria-label="View Blocked Users"
  >

    <svg class="fi">
      <use href="#f-ban"></use>
    </svg>

    Blocked Users

  </button>

</div>



<!-- ===== LUXURY CONFIRM MODAL ===== -->

<div
  id="friendConfirmModal"
  class="friend-confirm-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="friendConfirmTitle"
  aria-describedby="friendConfirmMessage"
  hidden
>

  <div class="friend-confirm-backdrop"
       onclick="closeFriendConfirm()"></div>

  <div class="friend-confirm-box">

    <!-- ICON -->
    <div class="friend-confirm-icon" id="friendConfirmIcon">
      <svg class="fi">
        <use href="#f-user-minus"></use>
      </svg>
    </div>

    <!-- TITLE -->
<h3 id="friendConfirmTitle">
  Confirm Action
</h3>

    <!-- MESSAGE -->
    <p id="friendConfirmMessage"></p>

    <!-- GOLD DIVIDER -->
    <div class="friend-confirm-divider"></div>

    <!-- ACTIONS -->
    <div class="friend-confirm-actions">

<button
  type="button"
  class="friend-confirm-cancel"
  onclick="closeFriendConfirm()"
>
  Cancel
</button>

<button
  type="button"
  class="friend-confirm-submit"
  id="friendConfirmSubmit"
  onclick="confirmFriendAction()"
>
  Confirm
</button>

    </div>

  </div>

</div>



<div id="toast-container" aria-live="polite"></div>

<script src="/push-init.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/app-entry-guard.js"></script>

<script>
const socket = io();
const profile = JSON.parse(localStorage.getItem("user_profile") || "{}");



/* ==========================================
   FRIENDS - SMOOTH PAGE NAVIGATION
========================================== */

function navigateFriends(url, label = "Loading Page...") {

  if (window.LSPTransition?.go) {

    LSPTransition.go(url, {
      label: label
    });

  } else {

    window.location.href = url;

  }

}



let __searchOpen = true;
let __lastData = { requests: [], friends: [] };

if (!profile.uid) location.href = "/login.html";

socket.on("connect", () => {
  if (profile.uid) socket.emit("auth-login", { uid: profile.uid });
});

const icon = name =>
  `<svg class="fi" aria-hidden="true"><use href="#f-${name}"></use></svg>`;

/* ===== TẢI DANH SÁCH ===== */

/* ==========================================
   FRIENDS - REALTIME DATA SYNC
========================================== */

let friendsLoadVersion = 0;

async function loadFriends() {

  if (!profile.uid) return;

  const version = ++friendsLoadVersion;

  try {

    const res = await fetch(
      "/api/friends/" + encodeURIComponent(profile.uid),
      {
        cache: "no-store",
        credentials: "same-origin"
      }
    );

    if (!res.ok) {
      throw new Error("Unable to load your friends list.");
    }

    const data = await res.json();

    // Prevent older responses from overwriting new data
    if (version !== friendsLoadVersion) return;

    __lastData = {

      requests: Array.isArray(data.requests)
        ? data.requests
        : [],

      friends: Array.isArray(data.friends)
        ? data.friends
        : []

    };

    // Preserve the current search
    applySearch();

  } catch (err) {

    if (version !== friendsLoadVersion) return;

    console.warn("[FRIENDS SYNC]", err);

  }

}


/* ===== AVATAR ===== */

function avatarUrl(value) {
  if (typeof value !== "string" || !value.trim()) return "";

  try {
    const url = new URL(value, location.origin);
    return ["https:", "http:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

/* ===== TẠO CARD ===== */

function createFriendRow(u, isRequest) {
  const row = document.createElement("div");
  row.className = "friend-row" + (isRequest ? " request" : "");

  row.innerHTML = `
    <div class="friend-avatar" role="button" tabindex="0" aria-label="View Profile">
      ${icon("user")}
    </div>
    <div class="friend-info" role="button" tabindex="0">
      <div class="friend-name">
        <span class="name-text"></span>
      </div>
      <span class="friend-level">
        ${icon("crown")}
        <span class="level-text"></span>
      </span>
    </div>
    <div class="friend-actions"></div>
  `;

  const name = String(u.name || "User");
  const uid = String(u.uid || "");

  row.querySelector(".name-text").textContent = name;
  row.querySelector(".level-text").textContent = "Lv " + (Number(u.level) || 1);

  const av = row.querySelector(".friend-avatar");
  const src = avatarUrl(u.avatar);

  if (src) {
    const image = document.createElement("img");
    image.src = src;
    image.alt = "Profile picture of " + name;
    image.loading = "lazy";
    image.onerror = () => { image.remove(); };
    av.replaceChildren(image);
  }

  const show = () => openProfile(uid);

  [av, row.querySelector(".friend-info")].forEach(el => {
    el.addEventListener("click", show);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        show();
      }
    });
  });

  if (u.verified) {
    const verified = document.createElement("span");
    verified.className = "verified";
    verified.title = "Verified Account";
    verified.innerHTML = icon("verified");
    row.querySelector(".friend-name").append(verified);
  }

  const actions = row.querySelector(".friend-actions");

  function addAction(label, symbol, css, cb) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "action-btn " + css;
    btn.innerHTML = icon(symbol) + `<span class="action-label"></span>`;
    btn.querySelector(".action-label").textContent = label;
    btn.setAttribute("aria-label", label + " " + name);
    btn.title = label;
    btn.onclick = cb;
    actions.append(btn);
  }

/* ==========================================
   FRIEND ACTION BUTTONS
   ENGLISH INTERFACE
========================================== */

if (isRequest) {

  addAction(
    "Accept",
    "check",
    "accept",
    () => respond(uid, true)
  );

  addAction(
    "Decline",
    "x",
    "reject",
    () => respond(uid, false)
  );

} else {

  addAction(
    "Message",
    "chat",
    "",
    () => chat(uid, name)
  );

  addAction(
    "Unfriend",
    "user-minus",
    "",
    () => removeFriend(uid, name)
  );

  addAction(
    "Block",
    "ban",
    "block",
    () => blockUser(uid, name)
  );

}

  return row;
}

/* ===== HIỂN THỊ DỮ LIỆU ===== */

function renderFriends(data) {
  const requests = Array.isArray(data.requests) ? data.requests : [];
  const friends = Array.isArray(data.friends) ? data.friends : [];

  document.getElementById("requestCount").textContent = requests.length;
  document.getElementById("friendCount").textContent = friends.length;

for (const [id, list, request, empty] of [

  [
    "reqList",
    requests,
    true,
   "No pending requests."
  ],

  [
    "friendList",
    friends,
    false,
    "No friends yet."
  ]

]) {
    const box = document.getElementById(id);
    box.replaceChildren();

    if (!list.length) {
      const el = document.createElement("div");
      el.className = "empty-state";
      el.innerHTML = icon("info") + `<div></div>`;
      el.querySelector("div").textContent = empty;
      box.append(el);
    } else {
      list.forEach(u => box.append(createFriendRow(u, request)));
    }
  }
}

/* ===== TÌM KIẾM ===== */

function toggleSearch() {
  __searchOpen = !__searchOpen;
  const box = document.getElementById("friendSearch");
  const input = document.getElementById("friendSearchInput");

  box.hidden = !__searchOpen;

  if (__searchOpen) {
    input.focus();
  } else {
    input.value = "";
    renderFriends(__lastData);
  }
}

function applySearch() {
  const query = document.getElementById("friendSearchInput")
    .value.trim().toLocaleLowerCase("vi-VN");

  if (!query) return renderFriends(__lastData);

  const matches = u =>
    String(u.name || "").toLocaleLowerCase("vi-VN").includes(query);

  renderFriends({
    requests: __lastData.requests.filter(matches),
    friends: __lastData.friends.filter(matches)
  });
}

/* ===== CÁC CHỨC NĂNG CŨ ===== */

/* ==========================================
   FRIENDS NAVIGATION
   LIVESTREAM PRO PAGE TRANSITION
========================================== */

// QUAY LẠI PROFILE
function goBack() {

  navigateFriends(
    "/profile.html",
    "Opening Your Profile..."
  );

}


// XEM HỒ SƠ NGƯỜI CHƠI
function openProfile(uid) {

  if (!uid) return;

  const url =
    "/profile.html?uid=" + encodeURIComponent(uid);

  navigateFriends(
    url,
    "Opening Member Profile..."
  );

}


// PHẢN HỒI LỜI MỜI KẾT BẠN
// GIỮ NGUYÊN CHỨC NĂNG CŨ
function respond(uid, accept) {

  socket.emit("friend-respond", {
    from: uid,
    accept
  });

  setTimeout(loadFriends, 400);

}


// MỞ CUỘC TRÒ CHUYỆN
function chat(uid, name) {

  if (!uid) return;

  // Giữ nguyên dữ liệu người nhận
  localStorage.setItem("chat_to_uid", uid);
  localStorage.setItem("chat_to_name", name);

  navigateFriends(
    "/messages.html",
    "Opening Conversation..."
  );

}



/* ==========================================
   LUXURY CONFIRM - FRIEND ACTIONS
========================================== */

let pendingFriendAction = null;
let friendConfirmPreviousFocus = null;

/* ===== MỞ POPUP ===== */

/* ==========================================
   FRIEND CONFIRMATION MODAL
   ENGLISH INTERFACE
========================================== */

function openFriendConfirm(type, uid, name) {

  const modal = document.getElementById(
    "friendConfirmModal"
  );

  const title = document.getElementById(
    "friendConfirmTitle"
  );

  const message = document.getElementById(
    "friendConfirmMessage"
  );

  const submit = document.getElementById(
    "friendConfirmSubmit"
  );

  const iconUse = document.querySelector(
    "#friendConfirmIcon use"
  );

  const isBlock = type === "block";


  // SAVE PENDING ACTION
  pendingFriendAction = {
    type,
    uid,
    name
  };


  // REMEMBER CURRENT FOCUS
  friendConfirmPreviousFocus = document.activeElement;


  // BLOCK ACCOUNT
  if (isBlock) {

    title.textContent = "Block This User?";

    message.textContent =
      `Are you sure you want to block ${name}? ` +
      `This person will no longer be able to contact you.`;

    submit.textContent = "Block User";

    iconUse.setAttribute(
      "href",
      "#f-ban"
    );

  }

  // REMOVE FRIEND
  else {

    title.textContent = "Remove Friend?";

    message.textContent =
      `Are you sure you want to remove ${name} from your friends list?`;

    submit.textContent = "Unfriend";

    iconUse.setAttribute(
      "href",
      "#f-user-minus"
    );

  }


  // APPLY MODAL STYLE
  modal.classList.toggle(
    "is-block",
    isBlock
  );


  // SHOW MODAL
  modal.hidden = false;


  // FOCUS CONFIRM BUTTON
  submit.focus();

}
/* ===== ĐÓNG POPUP ===== */

function closeFriendConfirm() {
  const modal = document.getElementById("friendConfirmModal");

  modal.hidden = true;
  pendingFriendAction = null;

  if (
    friendConfirmPreviousFocus &&
    friendConfirmPreviousFocus.isConnected
  ) {
    friendConfirmPreviousFocus.focus();
  }

  friendConfirmPreviousFocus = null;
}

/* ===== XÁC NHẬN THAO TÁC ===== */

function confirmFriendAction() {
  if (!pendingFriendAction) return;

  if (!socket.connected) {
showToast(
  "Connection lost. Please try again.",
  "error"
);
    return;
  }

  const { type, uid } = pendingFriendAction;

  closeFriendConfirm();

  if (type === "remove") {

    // GIỮ NGUYÊN EVENT CŨ
    socket.emit("friend-remove", { uid });

showToast(
  "Friend removal request sent.",
  "info"
);

  } else if (type === "block") {

    // GIỮ NGUYÊN EVENT CŨ
    socket.emit("user-block", { uid });

showToast(
  "User block request sent.",
  "info"
);
  }

  // TẢI LẠI DANH SÁCH TỪ SERVER
  setTimeout(loadFriends, 400);
}

/* ===== HỦY KẾT BẠN ===== */

function removeFriend(uid, name) {
  openFriendConfirm("remove", uid, name);
}

/* ===== CHẶN TÀI KHOẢN ===== */

function blockUser(uid, name) {
  openFriendConfirm("block", uid, name);
}

/* ===== ESC ĐỂ ĐÓNG ===== */

document.addEventListener("keydown", event => {
  const modal = document.getElementById("friendConfirmModal");

  if (!modal || modal.hidden) return;

  if (event.key === "Escape") {
    closeFriendConfirm();
  }

  // Giữ thao tác Tab trong hộp thoại
  if (event.key === "Tab") {
    const buttons = Array.from(
      modal.querySelectorAll("button:not(:disabled)")
    );

    const first = buttons[0];
    const last = buttons[buttons.length - 1];

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }
});


/* ===== THÔNG BÁO ===== */

function showToast(message, type = "info", timeout = 3500) {
  const box = document.getElementById("toast-container");
  const toast = document.createElement("div");

  toast.className = "toast " +
    (["info","success","error","warn"].includes(type) ? type : "info");

  const symbol = type === "success" ? "check"
    : type === "error" ? "ban" : "info";

  toast.innerHTML = icon(symbol) + `<span class="msg"></span>`;
  toast.querySelector(".msg").textContent =
  String(message || "Notification");

  box.append(toast);
  setTimeout(() => toast.remove(), timeout);
}

function notifyWithdraw(data) {
  const text =
  data?.text || "Coins have been deducted from your account.";

  if (typeof openSysModal === "function") openSysModal(text);
  else showToast(text, "error", 5000);
}

function showWithdrawNotify(data) {
  notifyWithdraw(data);
}

/* ===== FORCE LOGOUT ===== */

function showForceLogoutModal(message) {
  let modal = document.getElementById("forceLogoutModal");

  if (!modal) {
    modal = document.createElement("div");
    modal.id = "forceLogoutModal";
    modal.innerHTML = `
      <div class="fl-backdrop"></div>
      <div class="fl-box">
        <div class="fl-icon">${icon("ban")}</div>
        <div class="fl-title">Session Ended</div>
        <div class="fl-msg"></div>
        <div class="fl-sub">
  You will be redirected to the login page...
</div>
      </div>
    `;
    document.body.append(modal);
  }

  modal.querySelector(".fl-msg").textContent = message;
  modal.classList.add("show");
}

function clearLogin() {
  ["user_profile","login_uid","isGuest"]
    .forEach(key => localStorage.removeItem(key));
}

socket.on("system-notify", data => {
  if (!data) return;

  if (data.type === "topup")
    showToast(
  data.text || "Coins have been added to your account.",
  "success"
);

  if (data.type === "withdraw")
    notifyWithdraw(data);

  if (data.type === "lock") {
    showToast(
  data.reason || "Your account has been locked.",
  "error"
);
    clearLogin();
    setTimeout(() => location.href = "/login.html", 2000);
  }
});

socket.on("force-logout", data => {
  showForceLogoutModal(
  data?.message || "You have been signed out."
);
  clearLogin();
  setTimeout(() => location.href = "/login.html", 3000);
});

/* ==========================================
   FRIENDS - REALTIME EVENT LISTENERS
========================================== */

let friendsRefreshTimer = null;

function scheduleFriendsRefresh() {

  clearTimeout(friendsRefreshTimer);

  friendsRefreshTimer = setTimeout(() => {

    loadFriends();

  }, 100);

}


// New friend request
socket.on("friend-request", scheduleFriendsRefresh);


// Friend relationship updated
socket.on("friend-updated", scheduleFriendsRefresh);


// Friend request accepted
socket.on("friend-accepted", scheduleFriendsRefresh);


// Friend request accepted or declined
socket.on("friend-respond", scheduleFriendsRefresh);


// Friend removed
socket.on("friend-removed", scheduleFriendsRefresh);


// User blocked
socket.on("user-blocked", scheduleFriendsRefresh);


// User unblocked
socket.on("user-unblocked", scheduleFriendsRefresh);

socket.on("user-unblocked-by", scheduleFriendsRefresh);


// Restore data after reconnecting
socket.on("connect", scheduleFriendsRefresh);


// Restore when returning to the page
window.addEventListener("pageshow", event => {

  if (event.persisted) {

    scheduleFriendsRefresh();

  }

});


// Restore when returning to the app
document.addEventListener("visibilitychange", () => {

  if (document.visibilityState === "visible") {

    scheduleFriendsRefresh();

  }

});


// INITIAL LOAD
loadFriends();

</script>
</body>
</html>
