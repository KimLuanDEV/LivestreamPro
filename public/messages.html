body.page-messages {
  margin: 0;
  padding: 0;
  height: 100dvh;
  overflow: hidden;
  color: #f7f1e7;
  -webkit-text-size-adjust: 100%;
}

body.page-messages *, body.page-messages *::before, body.page-messages *::after {
  box-sizing: border-box;
}

body.page-messages .hidden, body.page-messages [hidden] {
  display: none !important;
}

body.page-messages .msg-svg {
  width: 20px;
  height: 20px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

body.page-messages .msg-shell {
  width: 100%;
  max-width: 1100px;
  height: 100dvh;
  margin: 0 auto;
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

body.page-messages .msg-topbar {
  position: relative;
  flex-shrink: 0;
  width: 100%;
  padding: calc(env(safe-area-inset-top,0px) + 8px) 17px 12px;
  display: grid;
  grid-template-columns: 44px minmax(0,1fr) 44px;
  align-items: center;
  gap: 10px;
  z-index: 10;
}

body.page-messages .msg-topbar::after {
  content: "";

  bottom: -1px;
  left: 16%;
  right: 16%;
  height: 1px;
  background: linear-gradient(90deg,transparent,#d9b676,transparent);
}

body.page-messages .msg-back {

  place-items: center;
  border: 1px solid var(--msg-line);
  color: var(--msg-light);

}

  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
}

body.page-messages .msg-brand {

  align-items: center;
  gap: 6px;
  font-size: 9px;
  letter-spacing: 1.8px;
  font-weight: 800;
  color: var(--msg-gold);
}

  height: 15px;
}

<div id="chatModal"

    <header class="chat-header">

      <div class="chat-header-title">
        <span id="chatTitle">Conversation</span>
      </div>

      <button
        type="button"
        class="chat-clear"
        onclick="confirmClearMyMessages()"
        aria-label="Clear history">

        <svg class="msg-svg">
          <use href="#mi-trash"></use>
        </svg>

      </button>

    </header>

    <!-- MESSAGE CONTENT -->

      <div id="chatBox" class="chatbox"></div>

        id="btnScrollBottom"
        class="chat-scroll-bottom hidden"

        <svg class="msg-svg">
          <use href="#mi-down"></use>
        </svg>

        <span class="scroll-dot"></span>

      </button>

    </div>

    <!-- COMPOSER -->
    <footer class="chatform">

          type="button"
          id="btnImage"
          class="chat-tool tool-image"

          </span>

          class="chat-tool tool-video"
          aria-label="Video">

            <svg class="msg-svg">
              <use href="#mi-video"></use>
            </svg>
          </span>

        </button>

        <!-- LOCATION -->

          type="button"
          id="btnLocation"
          class="chat-tool tool-location"
          aria-label="Location">

          <span class="tool-icon">
            <svg class="msg-svg">
              <use href="#mi-location"></use>
            </svg>
          </span>

        </button>

          type="file"
          id="imgInput"
          accept="image/*"
          multiple

          type="file"
          id="videoInput"
          accept="video/*"
          hidden>

        id="msgInput"
        rows="1"
