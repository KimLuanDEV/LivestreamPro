
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#080808">

<title>Virtual Live - Livestream Pro</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #050506;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
}

.page {
  display: flex;
  flex-direction: column;

  width: 100%;
  max-width: 650px;

  height: 100vh;
  height: 100dvh;

  margin: auto;

  background: #080808;
}

/* HEADER */

.header {
  display: flex;
  align-items: center;
  gap: 12px;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    12px;

  background: #111114;

  border-bottom: 1px solid #6c522a;
}

.back {
  width: 40px;
  height: 40px;

  border: 1px solid #997545;
  border-radius: 12px;

  background: #242019;
  color: #f5d59a;

  font-size: 25px;
  cursor: pointer;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;

  object-fit: cover;

  border: 2px solid #b9955c;
}

.info {
  flex: 1;
  min-width: 0;
}

.room-title {
  color: #f1d6a7;

  font-size: 13px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.room-meta {
  margin-top: 5px;
  font-size: 11px;
  color: #d3c1a3;
}

.live-badge {
  padding: 7px 9px;

  border-radius: 8px;

  background: #9e212a;
  color: #fff;

  font-size: 10px;
  font-weight: bold;
}

/* VIDEO */

.video-stage {
  position: relative;

  flex: 1;
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
}

.video-frame {
  display: block;

  width: 100%;
  max-height: 100%;

  aspect-ratio: 16 / 9;

  border: none;
  background: #000;
}

.video-native {
  display: block;
  width: 100%;
  max-height: 100%;
  background: #000;
}

.loading {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: #08080b;

  color: #e8cca2;

  text-align: center;
  font-size: 14px;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}

/* FOOTER */

.footer {
  padding:
    14px
    15px
    calc(18px + env(safe-area-inset-bottom));

  background: #111114;

  border-top: 1px solid #6c522a;

  color: #aaa;

  font-size: 12px;
  text-align: center;
}

</style>

</head>

<body>

<div class="page">

  <header class="header">

    <button class="back" id="backBtn">
      ‹
    </button>

    <img
      id="roomAvatar"
      class="avatar"
      src="/icons/icon-192.png"
      alt="Room Avatar"
    >

    <div class="info">

      <div class="room-title" id="roomTitle">
        VIRTUAL LIVE
      </div>

      <div class="room-meta">

        <span id="viewerCount">0</span>
        viewers watching

      </div>

    </div>

    <span class="live-badge">
      ● LIVE
    </span>

  </header>


  <main class="video-stage" id="videoStage">

    <div class="loading" id="loadingState">
      Loading video...
    </div>

  </main>


  <footer class="footer">

    VIRTUAL LIVE ROOM

  </footer>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

(() => {

  "use strict";

  const params = new URLSearchParams(location.search);

  const roomId = params.get("room") || "Youtube";

  const roomTitle =
    document.getElementById("roomTitle");

  const roomAvatar =
    document.getElementById("roomAvatar");

  const viewerCount =
    document.getElementById("viewerCount");

  const videoStage =
    document.getElementById("videoStage");

  const loadingState =
    document.getElementById("loadingState");


  // Back to Lobby

  document.getElementById("backBtn").onclick = () => {
    location.href = "/lobby.html";
  };


  // SOCKET

  const socket = io({
    transports: ["websocket", "polling"]
  });


  function joinRoom() {

    socket.emit(
      "virtual-live:join",
      { roomId },
      response => {

        if (!response?.ok) {

          showError(
            "This virtual room is not available."
          );

        }

      }
    );

  }


  socket.on("connect", joinRoom);


  // Viewer Count

  socket.on("virtual-live:counts", counts => {

    viewerCount.textContent =
      String(counts?.[roomId] ?? 0);

  });


  // Error

  function showError(message) {

    loadingState.classList.remove("hidden");

    loadingState.textContent = message;

  }


  // LOAD VIDEO

  async function loadVideo() {

    try {

      const response = await fetch(
        "/api/virtual-live/rooms/" +
        encodeURIComponent(roomId),
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("Room not found");
      }

      const room = await response.json();

      roomTitle.textContent =
        room.title || roomId;

      roomAvatar.src =
        room.avatar || "/icons/icon-192.png";


      // YOUTUBE

      if (room.type === "youtube") {

        const videoId = String(room.videoId || "");

        if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
          throw new Error("Invalid YouTube video ID");
        }

        const iframe =
          document.createElement("iframe");

        iframe.className = "video-frame";

        iframe.title =
          room.title || "YouTube Video";

        iframe.allow =
          "autoplay; encrypted-media; fullscreen; picture-in-picture";

        iframe.allowFullscreen = true;

        iframe.referrerPolicy =
          "strict-origin-when-cross-origin";

        iframe.src =
          "https://www.youtube.com/embed/" +
          encodeURIComponent(videoId) +
          "?autoplay=1&playsinline=1&rel=0";

        videoStage.appendChild(iframe);

      }


      // MP4

      else if (room.type === "mp4") {

        const video =
          document.createElement("video");

        video.className = "video-native";

        video.controls = true;

        video.autoplay = true;

        video.playsInline = true;

        video.preload = "metadata";

        video.src = room.url;

        videoStage.appendChild(video);

        video.play().catch(() => {});

      }

      else {

        throw new Error(
          "Unsupported video source"
        );

      }

      loadingState.classList.add("hidden");

    }

    catch (error) {

      showError(
        "Cannot open video: " + error.message
      );

    }

  }


  loadVideo();


  // Leave Room

  window.addEventListener("pagehide", () => {

    socket.emit("virtual-live:leave");

  });

})();

</script>

</body>
</html>
