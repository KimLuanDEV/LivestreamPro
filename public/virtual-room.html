
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#080808">

<title>Virtual Live - Livestream Pro</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #050506;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
}

.page {
  display: flex;
  flex-direction: column;

  width: 100%;
  max-width: 650px;

  height: 100vh;
  height: 100dvh;

  margin: auto;

  background: #080808;
}

/* HEADER */

.header {
  display: flex;
  align-items: center;
  gap: 12px;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    12px;

  background: #111114;

  border-bottom: 1px solid #6c522a;
}

.back {
  width: 40px;
  height: 40px;

  border: 1px solid #997545;
  border-radius: 12px;

  background: #242019;
  color: #f5d59a;

  font-size: 25px;
  cursor: pointer;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;

  object-fit: cover;

  border: 2px solid #b9955c;
}

.info {
  flex: 1;
  min-width: 0;
}

.room-title {
  color: #f1d6a7;

  font-size: 13px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.room-meta {
  margin-top: 5px;
  font-size: 11px;
  color: #d3c1a3;
}

.live-badge {
  padding: 7px 9px;

  border-radius: 8px;

  background: #9e212a;
  color: #fff;

  font-size: 10px;
  font-weight: bold;
}

/* VIDEO */

.video-stage {
  position: relative;

  flex: 1;
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
}

.video-frame {
  display: block;

  width: 100%;
  max-height: 100%;

  aspect-ratio: 16 / 9;

  border: none;
  background: #000;
}

.video-native {
  display: block;
  width: 100%;
  max-height: 100%;
  background: #000;
}

.loading {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: #08080b;

  color: #e8cca2;

  text-align: center;
  font-size: 14px;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}

/* FOOTER */

.footer {
  padding:
    14px
    15px
    calc(18px + env(safe-area-inset-bottom));

  background: #111114;

  border-top: 1px solid #6c522a;

  color: #aaa;

  font-size: 12px;
  text-align: center;
}


/* ==========================================
   LINKED LIVE - LUXURY BLACK & GOLD
========================================== */

.linked-live-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  padding: 12px 15px
    calc(12px + env(safe-area-inset-bottom, 0px));

  background: linear-gradient(
    145deg, #211b14, #111217
  );

  border-top: 1px solid #725834;
}

.linked-owner {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  text-align: left;
}

.linked-owner img {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  object-fit: cover;
  border: 1.5px solid #c6a36b;
  border-radius: 50%;
}

.linked-owner-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.linked-owner-info small {
  font-size: 9px;
  letter-spacing: 1.4px;
  color: #b99a65;
}

.linked-owner-info strong {
  font-size: 14px;
  color: #f3dab0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.linked-owner-info span {
  font-size: 10px;
  color: #a9a39b;
}

.linked-gift-btn {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  display: grid;
  place-items: center;

  border: 1px solid #f3d29a;
  border-radius: 14px;

  background: linear-gradient(
    135deg, #f4ddb0, #b58b50
  );

  color: #261b10;
  cursor: pointer;
}

.linked-gift-btn svg {
  width: 26px;
  height: 26px;
}

/* ==========================================
   LINKED LIVE - COMPACT GIFT PANEL V2.0
   SYNC BROADCAST SFU
========================================== */

.lg-modal {
  position: fixed;
  inset: 0;
  z-index: 10000;

  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.lg-backdrop {
  position: absolute;
  inset: 0;

  background: rgba(0,0,0,.15);
}

/* COMPACT BOTTOM SHEET */

.lg-sheet {
  position: relative;
  z-index: 1;

  display: flex;
  flex-direction: column;

  width: min(100%, 480px);

  height: 52vh;
  height: 52dvh;
  max-height: 52dvh;

  padding:
    8px
    10px
    calc(10px + env(safe-area-inset-bottom, 0px));

  gap: 6px;

  overflow: hidden;

  border: 0;
  border-radius: 20px 20px 0 0;

  background: #211C19;

  box-shadow: 0 -5px 30px rgba(0,0,0,.2);

  animation: lgSlideUp .22s ease-out;
}

@keyframes lgSlideUp {
  from {
    transform: translateY(100%);
  }

  to {
    transform: translateY(0);
  }
}

/* HANDLE */

.lg-handle {
  flex-shrink: 0;

  width: 30px;
  height: 3px;

  margin: 0 auto 3px;

  border-radius: 99px;

  background: rgba(255,255,255,.25);
}

/* MINIMAL HEADER */

.lg-header {
  display: flex;
  flex-shrink: 0;

  align-items: center;
  justify-content: space-between;

  gap: 8px;

  padding: 3px 4px 8px;

  margin: 0;

  border-bottom: 1px solid rgba(255,255,255,.06);
}

.lg-header h3 {
  margin: 0;

  color: #F0DFBF;

  font-size: 14px;
  font-weight: 750;
}

.lg-header small {
  color: #978D82;

  font-size: 9px;
  letter-spacing: 1px;
}

.lg-close {
  display: grid;
  place-items: center;

  width: 30px;
  height: 30px;

  padding: 0;

  background: transparent;

  border: 0;

  color: #C6BEB5;

  font-size: 23px;

  cursor: pointer;
}

/* RECIPIENT */

.lg-recipient {
  flex-shrink: 0;

  padding: 2px 4px;

  color: #978D82;

  font-size: 10px;
  line-height: 1.4;
}

.lg-recipient strong {
  color: #E4C797;

  font-weight: 650;
}

.lg-recipient small {
  display: block;

  margin-top: 2px;

  font-size: 9px;
  color: #978D82;
}

/* SCROLLABLE GIFT GRID */

.lg-grid {
  flex: 1 1 0;

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  grid-auto-rows: min-content;

  align-content: start;

  min-height: 0;
  max-height: none;

  gap: 5px 3px;

  padding: 3px 0;
  margin: 0;

  overflow-x: hidden;
  overflow-y: auto;

  overscroll-behavior: contain;

  scrollbar-width: none;

  -webkit-overflow-scrolling: touch;
}

.lg-grid::-webkit-scrollbar {
  display: none;
}

/* GIFT ITEMS */

.lg-item {
  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: flex-start;

  min-width: 0;
  min-height: 0;

  height: auto;

  gap: 3px;

  padding: 5px 2px;

  background: transparent;

  border: 1px solid transparent;
  border-radius: 10px;

  box-shadow: none;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

/* SELECTED GIFT */

.lg-item.active {
  background: rgba(223,190,131,.085);

  border-color: rgba(223,190,131,.8);

  box-shadow: none;
}

/* GIFT IMAGE */

.lg-item .lg-gift-image {
  display: block;

  width: 100%;
  max-width: 64px;

  height: 58px;

  flex-shrink: 0;

  object-fit: contain;

  background: transparent;

  filter: none;

  pointer-events: none;
  user-select: none;

  transition: transform .15s ease;
}

.lg-item.active .lg-gift-image {
  transform: scale(1.04);
}

/* GIFT NAME */

.lg-item strong {
  display: block;

  width: 100%;

  color: #BBB1A7;

  font-size: 10px;
  font-weight: 500;

  line-height: 1.3;
  text-align: center;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* GIFT PRICE */

.lg-item small {
  color: #ECD19B;

  font-size: 10px;
  font-weight: 650;

  line-height: 1.2;

  white-space: nowrap;
}

/* COMBO QUANTITY */

.lg-combo {
  flex-shrink: 0;

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0,1fr));

  gap: 5px;

  margin: 0;

  padding: 6px 0 3px;

  border-top: 1px solid rgba(255,255,255,.07);
}

.lg-combo button {
  height: 29px;

  padding: 0 3px;

  border: 1px solid rgba(255,255,255,.1);
  border-radius: 99px;

  background: transparent;

  color: #BBB1A6;

  font-size: 11px;
  font-weight: 650;

  cursor: pointer;
}

.lg-combo button.active {
  border-color: rgba(223,190,131,.6);

  background: rgba(223,190,131,.15);

  color: #F0D39C;
}

/* BOTTOM BAR */

.lg-bottom {
  display: flex;

  flex-shrink: 0;

  align-items: center;
  justify-content: space-between;

  gap: 8px;

  padding: 3px 0;

  min-height: 44px;
}

/* DIAMOND BALANCE */

.lg-wallet {
  display: flex;

  align-items: center;
  flex-shrink: 0;

  gap: 4px;

  min-width: 0;

  height: 36px;

  padding: 0 10px;

  margin: 0;

  border: 1px solid rgba(223,190,131,.19);
  border-radius: 99px;

  background: rgba(0,0,0,.12);
}

.lg-wallet span {
  font-size: 14px;
}

#lgBalance {
  color: #F4E5CE;

  font-size: 12px;
  font-weight: 750;

  white-space: nowrap;
}

/* TOTAL COST */

.lg-total {
  display: flex;
  flex: 1;

  min-width: 0;

  flex-direction: column;

  align-items: flex-end;
  justify-content: center;

  gap: 3px;
}

.lg-total span {
  color: #9A9085;

  font-size: 8px;
  font-weight: 500;
}

#lgTotal {
  color: #EDCF95;

  font-size: 11px;
  font-weight: 750;

  overflow-wrap: anywhere;
}

/* SEND BUTTON */

.lg-send {
  flex: 0 0 auto;

  width: auto;

  min-width: 76px;
  max-width: 125px;

  height: 36px;

  padding: 0 12px;

  border: 0;
  border-radius: 99px;

  background: linear-gradient(
    135deg,
    #F0D59F,
    #C99D5B
  );

  color: #241A0D;

  font-size: 10px;
  font-weight: 850;

  cursor: pointer;
}

.lg-send:disabled {
  background: #42392D;

  color: #A69A89;

  opacity: .7;

  cursor: not-allowed;
}

.linked-gift-btn:disabled {
  opacity: .4;

  cursor: not-allowed;
}

/* FEEDBACK */

.lg-message {
  flex-shrink: 0;

  min-height: 0;

  margin: 0;
  padding: 0 3px;

  color: #E2C58E;

  font-size: 10px;

  line-height: 1.3;
  text-align: center;
}

.lg-message:empty {
  display: none;
}

/* SMALL MOBILE */

@media (max-width: 380px) {

  .lg-sheet {
    padding-left: 7px;
    padding-right: 7px;
  }

  .lg-item .lg-gift-image {
    max-width: 57px;
    height: 48px;
  }

  .lg-item strong,
  .lg-item small {
    font-size: 9px;
  }

  .lg-send {
    min-width: 66px;
    padding: 0 8px;
  }

  .lg-wallet {
    padding: 0 7px;
  }

}


/* REALTIME GIFT ANIMATION */

.lg-effect {
  position: fixed;
  left: 50%;
  top: 22%;
  transform: translateX(-50%);
  z-index: 11000;

  width: min(280px, 82vw);
  padding: 20px;

  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 9px;

  background: linear-gradient(
    135deg, #392b18ee, #101116f2
  );

  border: 1px solid #d9b579;
  border-radius: 19px;

  color: #f2d7a6;
  pointer-events: none;

  box-shadow: 0 0 28px rgba(218,170,87,.2);

  animation: lgGiftPop .4s ease-out;
}

.lg-effect .lg-effect-image {

  display: block;

  width: 96px;
  height: 96px;

  object-fit: contain;

  background: transparent;

  filter: drop-shadow(
    0 0 15px rgba(232,190,110,.35)
  );

  pointer-events: none;

  user-select: none;

}

.lg-effect strong {
  font-size: 17px;
}

.lg-effect small {
  font-size: 12px;
  text-align: center;
}

@keyframes lgGiftPop {
  from {
    opacity: 0;
    transform: translate(-50%, 20px) scale(.8);
  }

  to {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .lg-sheet,
  .lg-effect {
    animation: none;
  }
}

</style>

</head>

<body>

<footer class="footer linked-live-footer">

</div>

<div

<!-- REALTIME GIFT EFFECT -->

<div

>

 <img

>

  <strong id="lgEffectName"></strong>

  <small id="lgEffectText"></small>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>

(() => {

  "use strict";

  const params = new URLSearchParams(location.search);

  const roomId = params.get("room") || "Youtube";

  let activeAutoYoutubeVideoId = null;

  const roomTitle =
    document.getElementById("roomTitle");

  const roomAvatar =
    document.getElementById("roomAvatar");

  const viewerCount =
    document.getElementById("viewerCount");

  const videoStage =
    document.getElementById("videoStage");

  const loadingState =
    document.getElementById("loadingState");


  // Back to Lobby

  document.getElementById("backBtn").onclick = () => {
    location.href = "/lobby.html";
  };


  // SOCKET

  const socket = io({
    transports: ["websocket", "polling"]
  });


  /* ==========================================
   LINKED LIVE - GIFT ENGINE
========================================== */

const lg = id => document.getElementById(id);

let lgOwner = null;
let lgCatalog = [];
let lgSelected = null;
let lgQuantity = 1;
let lgCoins = 0;
let lgEnabled = false;
let lgSending = false;
let lgJoined = false;
let lgSourceLive = false;
let lgEffectTimer = null;
let lgPending = null;

const lgFormat = value =>
  Number(value || 0).toLocaleString("en-US");


// Restore an unconfirmed transaction after reload.

const lgPendingKey =
  "lsp_linked_gift_pending_" + roomId;

try {

  lgPending = JSON.parse(
    sessionStorage.getItem(lgPendingKey) || "null"
  );

} catch {

  lgPending = null;

}


/* ==========================================
   LINKED ACCOUNT DISPLAY
========================================== */

function renderLinkedOwner(owner) {

  lgOwner = owner || null;

  lg("linkedOwnerName").textContent =
    owner?.name || "Not linked";

  lg("linkedOwnerAvatar").src =
    owner?.avatar || "/icons/icon-192.png";

  lg("lgRecipient").textContent =
    owner
      ? `${owner.name} (${owner.uid})`
      : "Unavailable";

  updateLinkedGiftButton();

}


lg("linkedOwnerAvatar").onerror = function() {

  this.onerror = null;

  this.src = "/icons/icon-192.png";

};


function updateLinkedGiftButton() {

  lg("linkedGiftBtn").disabled = !(
    socket.connected &&
    lgJoined &&
    (
      (lgOwner && lgSourceLive) ||
      lgPending
    )
  );

}


/* ==========================================
   COMPACT GIFT - SEND BUTTON STATE
========================================== */

function updateLgSend() {

  const btn = lg("lgSend");

  const total = lgSelected
    ? lgSelected.cost * lgQuantity
    : 0;

  /* UPDATE BALANCE */

  lg("lgBalance").textContent =
    lgFormat(lgCoins);

  /* UPDATE TOTAL */

  lg("lgTotal").textContent =
    `${lgFormat(total)} 💎`;

  /* SENDING */

  if (lgSending) {

    btn.disabled = true;
    btn.textContent = "SENDING...";

    return;

  }

  /* PENDING TRANSACTION */

  if (lgPending) {

    btn.disabled = !(
      socket.connected &&
      lgJoined
    );

    btn.textContent = "CHECK / RETRY";

    return;

  }

  /* GIFT UNAVAILABLE */

  if (!lgEnabled || !lgSourceLive) {

    btn.disabled = true;
    btn.textContent = "UNAVAILABLE";

    return;

  }

  /* NO SELECTED GIFT */

  if (!lgSelected) {

    btn.disabled = true;
    btn.textContent = "SELECT";

    return;

  }

  /* CHECK BALANCE */

  btn.disabled = !(
    socket.connected &&
    lgJoined &&
    lgCoins >= total
  );

  btn.textContent = lgCoins >= total
    ? "SEND"
    : "NOT ENOUGH";

}
/* ==========================================
   GIFT IMAGES
========================================== */

// Adjust this path if your gift assets
// are stored in another directory.

/* ==========================================
   GIFT IMAGES - SYNC BROADCAST SFU
========================================== */

const LG_GIFT_ASSET_PATH = "/assets/live-gifts/";

const LG_GIFT_FILES = {
  rose: "rose.webp",
  heart: "heart.webp",
  flower: "flower.webp",
  cake: "cake.webp",
  rocket: "rocket.webp",
  diamond: "diamond.webp",

function getLgGiftImage(giftId) {

  const file = Object.hasOwn(LG_GIFT_FILES, giftId)
    ? LG_GIFT_FILES[giftId]
    : "heart.webp";

  return LG_GIFT_ASSET_PATH + file;

}

/* ==========================================
   RENDER GIFT CATALOG
========================================== */

function renderLgCatalog() {

  const list = lg("lgGiftList");

  list.replaceChildren();

  for (const gift of lgCatalog) {

    const btn = document.createElement("button");

    btn.type = "button";

    btn.className = "lg-item";

    if (lgSelected?.id === gift.id) {

      btn.classList.add("active");

    }

const img = document.createElement("img");

img.className = "lg-gift-image";

img.src = getLgGiftImage(gift.id);

img.alt = gift.name;

img.loading = "lazy";

img.decoding = "async";

img.draggable = false;

img.onerror = function () {

  this.onerror = null;

  this.src = LG_GIFT_ASSET_PATH + "heart.webp";

};

    const name =
      document.createElement("strong");

    name.textContent = gift.name;


    const cost =
      document.createElement("small");

    cost.textContent =
      "💎 " + lgFormat(gift.cost);


    btn.append(img, name, cost);


    btn.onclick = () => {

      if (lgSending || lgPending) return;

      lgSelected = gift;

      list.querySelectorAll(".lg-item")
        .forEach(item =>
          item.classList.remove("active")
        );

      btn.classList.add("active");

      lg("lgMessage").textContent = "";

      updateLgSend();

    };

    list.appendChild(btn);

  }

}


/* ==========================================
   LOAD REAL SERVER CATALOG
========================================== */

function loadLgCatalog() {

  lgEnabled = false;

  updateLgSend();

  socket.timeout(8000).emit(

    "virtual-live:gift:catalog",

    { roomId },

    (error, reply) => {

      if (
        error ||
        !reply?.ok ||
        !socket.connected ||
        !lgJoined
      ) {

        lg("lgMessage").textContent =
          "Unable to load gifts. Please try again.";

        updateLgSend();

        return;

      }

      renderLinkedOwner(reply.owner);

      lgCatalog = Array.isArray(reply.gifts)
        ? reply.gifts
        : [];

      lgCoins = Number(reply.coins || 0);

      lgEnabled = Boolean(reply.enabled);

      lgSelected = lgCatalog.find(
        gift => gift.id === lgSelected?.id
      ) || lgCatalog[0] || null;


      if (lgPending) {

        lg("lgMessage").textContent =
          "An unconfirmed transaction exists. " +
          "Retry it to check the previous payment.";

      } else if (!reply.authenticated) {

        lg("lgMessage").textContent =
          "Please sign in to send gifts.";

      } else if (!lgEnabled) {

        lg("lgMessage").textContent =
          "Gifts are currently unavailable.";

      } else {

        lg("lgMessage").textContent = "";

      }


      renderLgCatalog();

      updateLgSend();

    }

  );

}


/* ==========================================
   OPEN / CLOSE GIFT PANEL
========================================== */

lg("linkedGiftBtn").onclick = () => {

  lg("linkedGiftModal")
    .classList.remove("hidden");

  loadLgCatalog();

};


function closeLinkedGiftModal() {

  lg("linkedGiftModal")
    .classList.add("hidden");

}


lg("lgClose").onclick =
  closeLinkedGiftModal;

lg("lgBackdrop").onclick =
  closeLinkedGiftModal;


/* ==========================================
   GIFT COMBO
========================================== */

document.querySelectorAll(
  ".lg-combo button"
).forEach(btn => {

  btn.onclick = () => {

    if (lgSending || lgPending) return;

    lgQuantity = Number(btn.dataset.qty);

    document.querySelectorAll(
      ".lg-combo button"
    ).forEach(item => {

      item.classList.toggle(
        "active",
        item === btn
      );

    });

    updateLgSend();

  };

});


/* ==========================================
   SEND REAL GIFT
========================================== */

lg("lgSend").onclick = () => {

  if (
    lgSending ||
    !socket.connected ||
    !lgJoined
  ) return;


  if (!lgPending) {

    if (
      !lgEnabled ||
      !lgSourceLive ||
      !lgSelected ||
      !lgOwner
    ) return;

    const total =
      lgSelected.cost * lgQuantity;

    if (lgCoins < total) return;


    lgPending = {

      roomId,

      giftId: lgSelected.id,

      quantity: lgQuantity,

      expectedOwnerUid: lgOwner.uid,

      expectedCost: total,

      requestId: crypto.randomUUID()

    };

  }


  // Save the same request ID for safe retries.

  try {

    sessionStorage.setItem(
      lgPendingKey,
      JSON.stringify(lgPending)
    );

  } catch {

    lgPending = null;

    lg("lgMessage").textContent =
      "Unable to secure transaction. Please retry.";

    updateLgSend();

    return;

  }


  lgSending = true;

  lg("lgMessage").textContent = "";

  updateLgSend();


  socket.timeout(10000).emit(

    "virtual-live:gift:send",

    lgPending,

    (error, reply) => {

      lgSending = false;


      // Do not create a new transaction ID
      // when the server response is lost.

      if (error || !reply) {

        lg("lgMessage").textContent =
          "Payment status unknown. " +
          "Retry to check the same transaction.";

        updateLgSend();

        return;

      }


      lgPending = null;

      sessionStorage.removeItem(lgPendingKey);


      if (!reply.ok) {

        lg("lgMessage").textContent =
          reply.error || "Unable to send gift.";

        updateLgSend();

        return;

      }


      lgCoins = Number(reply.coins || 0);

      lg("lgMessage").textContent =
        "Gift sent successfully!";

      updateLgSend();

      updateLinkedGiftButton();

    }

  );

};


/* ==========================================
   REALTIME WALLET UPDATE
========================================== */

socket.on("coin-update", data => {

  if (
    Number.isSafeInteger(
      Number(data?.coins)
    )
  ) {

    lgCoins = Number(data.coins);

    updateLgSend();

});


/* ==========================================
   REALTIME GIFT EFFECT
========================================== */

socket.on("virtual-live:gift:new", data => {

  if (data?.roomId !== roomId) return;

const giftImage = lg("lgEffectIcon");

giftImage.onerror = function () {

  this.src = LG_GIFT_ASSET_PATH + "heart.webp";

};

giftImage.src = getLgGiftImage(data.giftId);

giftImage.alt = data.giftName || "Gift";

  lg("lgEffectName").textContent =
    data.donor || "Viewer";

  lg("lgEffectText").textContent =

    `Sent ${data.giftName} ×${data.quantity}` +

  const effect = lg("lgGiftEffect");

  effect.classList.add("hidden");

  void effect.offsetWidth;

  effect.classList.remove("hidden");


  clearTimeout(lgEffectTimer);

  lgEffectTimer = setTimeout(() => {

    effect.classList.add("hidden");

  }, 3500);

});


/* ==========================================
   CONNECTION PROTECTION
========================================== */

socket.on("disconnect", () => {

  lgJoined = false;

  lgEnabled = false;

  lg("lgMessage").textContent =
    "Connection lost. Reconnecting...";

  updateLinkedGiftButton();

  updateLgSend();

});


/* ==========================================
   LINKED LIVE SOURCE STATUS
========================================== */

function applyLinkedLiveRoom(room) {

  lgSourceLive = Boolean(
    room?.giftsEnabled &&
    room?.status === "live"
  );

  renderLinkedOwner(room?.linkedOwner);

  if (!lgSourceLive) {

    lgEnabled = false;

  }

  updateLgSend();

}

function joinRoom() {

  lgJoined = false;

  socket.timeout(8000).emit(

    "virtual-live:join",

    { roomId },

    (error, response) => {

      if (error || !response?.ok) {

        showError(
          "This virtual room is not available."
        );

        updateLinkedGiftButton();

      }

      lgJoined = true;

      updateLinkedGiftButton();

      ) {

}


  socket.on("connect", joinRoom);


  // Viewer Count

  socket.on("virtual-live:counts", counts => {

    viewerCount.textContent =
      String(counts?.[roomId] ?? 0);

  });


  // Error

  function showError(message) {

    loadingState.textContent = message;

  }


  // LOAD VIDEO

  async function loadVideo() {

    try {

      const response = await fetch(
        "/api/virtual-live/rooms/" +

        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("Room not found");
      }

const room = await response.json();

applyLinkedLiveRoom(room);

roomTitle.textContent =
  room.title || roomId;

      roomAvatar.src =
        room.avatar || "/icons/icon-192.png";




/* ==========================================
   YOUTUBE1/2/3 - AUTOMATIC LIVE PLAYER
========================================== */

if (
  roomId === "Youtube1" ||
  roomId === "Youtube2" ||
  roomId === "Youtube3"
) {


  const isLive =
    room.status === "live" &&
    /^[a-zA-Z0-9_-]{11}$/.test(
      String(room.videoId || "")
    );

  const badge =
    document.querySelector(".live-badge");

  if (badge) {
    badge.textContent = isLive
      ? "● LIVE"
      : "OFFLINE";

    badge.style.background = isLive
      ? "#9e212a"
      : "#444";
  }

  // Remove previous player when source changes.
  videoStage
    .querySelectorAll("iframe, video")
    .forEach(player => player.remove());

activeAutoYoutubeVideoId = isLive
  ? room.videoId
  : "";

  if (!isLive) {

    const message =
      room.status === "unconfigured"
        ? "YouTube API is not configured."
        : room.status === "error"
          ? "Unable to check livestream status."
          : "Channel is offline. Waiting for the next livestream...";

    showError(message);

    return;
  }

}





/* ==========================================
   VIRTUAL LIVE - UNIVERSAL VIDEO PLAYER
   YOUTUBE / MP4 / HLS / IFRAME
========================================== */

const type = String(room.type || "").toLowerCase();

const url = String(room.url || "").trim();

function validVideoUrl(value) {

  try {

    const parsed = new URL(value, location.origin);

    return (
      parsed.protocol === "https:" ||
      (
        parsed.protocol === "http:" &&
        parsed.origin === location.origin
      )
    );

  } catch {

    return false;

  }

}

function makeVideo() {

  const video = document.createElement("video");

  video.className = "video-native";

  video.controls = true;
  video.autoplay = true;
  video.playsInline = true;

  video.preload = "auto";

  video.addEventListener("error", () => {
    showError("Unable to load video source.");
  });

  videoStage.appendChild(video);

  return video;

}



/* ==========================================
   VIRTUAL LIVE - VIDEO TIME SYNC
========================================== */

function enableVirtualLiveSync(video, room) {

  if (!room.sync || !room.startedAt) {
    return;
  }

  // Ước lượng chênh lệch đồng hồ client/server
  const clockOffset =
    Number(room.serverNow) - Date.now();

  let syncTimer = null;

  function getTargetTime() {

    const duration = video.duration;

    if (
      !Number.isFinite(duration) ||
      duration <= 0
    ) {
      return null;
    }

    const serverTime =
      Date.now() + clockOffset;

    const elapsed = Math.max(
      0,
      (serverTime - room.startedAt) / 1000
    );

    // Phát lặp liên tục theo đồng hồ server
    if (room.loop) {
      return elapsed % duration;
    }

    return Math.min(
      elapsed,
      Math.max(0, duration - 0.1)
    );

  }

  function syncPlayback(force = false) {

    const target = getTargetTime();

    if (target === null) return;

    const duration = video.duration;

    const diff = Math.abs(
      video.currentTime - target
    );

    // Tính khoảng cách khi video lặp
    const circularDiff = room.loop
      ? Math.min(diff, duration - diff)
      : diff;

    if (force || circularDiff > 2) {

      try {
        video.currentTime = target;
      } catch (error) {
        console.warn("Video sync failed", error);
      }

    }

    // Đảm bảo video tiếp tục chạy
    if (video.paused && !video.ended) {

      attemptPlay(video);

    }

  }

  function startSync() {

    syncPlayback(true);

    if (syncTimer) {
      clearInterval(syncTimer);
    }

    // Kiểm tra sai lệch sau mỗi 5 giây
    syncTimer = setInterval(() => {

      if (document.hidden) return;

      syncPlayback();

    }, 5000);

  }

  video.addEventListener(
    "loadedmetadata",
    startSync,
    { once: true }
  );

  video.addEventListener("ended", () => {

    if (room.loop) {
      syncPlayback(true);
    }

  });

  document.addEventListener(
    "visibilitychange",
    () => {

      if (!document.hidden) {
        syncPlayback(true);
      }

    }
  );

  window.addEventListener(
    "pagehide",
    () => {

      if (syncTimer) {
        clearInterval(syncTimer);
      }

    },
    { once: true }
  );

}



function attemptPlay(video) {

  video.play().catch(() => {

    // Một số trình duyệt chỉ cho autoplay khi mute.

    video.muted = true;

    video.play().catch(() => {

      // Người xem có thể bấm Play thủ công.

    });

  });

}


// ==========================================
// YOUTUBE
// ==========================================

if (type === "youtube") {

  const videoId = String(room.videoId || "");

  if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    throw new Error("Invalid YouTube ID");
  }

  const iframe = document.createElement("iframe");

  iframe.className = "video-frame";

  iframe.title = room.title || "YouTube";

  iframe.allow =
    "autoplay; encrypted-media; fullscreen; picture-in-picture";

  iframe.allowFullscreen = true;

  iframe.referrerPolicy =
    "strict-origin-when-cross-origin";

  iframe.src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(videoId) +
    "?autoplay=1&playsinline=1&rel=0";

  videoStage.appendChild(iframe);

}


// ==========================================
// MP4 / WEBM
// ==========================================


else if (type === "mp4") {

  if (!validVideoUrl(url)) {
    throw new Error("Invalid video URL");
  }

  const video = makeVideo();

  video.loop = Boolean(room.loop);

  // Không cho điều khiển thời gian phát
  // khi phòng đang ở chế độ LIVE SYNC
  if (room.sync) {

    video.controls = false;

  }

  video.src = url;

  // Bật đồng bộ theo server
  enableVirtualLiveSync(video, room);

  // Autoplay nếu trình duyệt cho phép
  attemptPlay(video);

}



// ==========================================
// HLS - M3U8 LIVE STREAM
// ==========================================

else if (type === "hls") {

  if (!validVideoUrl(url)) {
    throw new Error("Invalid HLS URL");
  }

  const video = makeVideo();

  // Safari / iOS Native HLS
  if (
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src = url;

    attemptPlay(video);

  }

  // Chrome / Android / Edge
  else if (
    window.Hls &&
    Hls.isSupported()
  ) {

    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true
    });

    hls.loadSource(url);

    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {

      attemptPlay(video);

    });

    hls.on(Hls.Events.ERROR, (_, data) => {

      if (data.fatal) {

        showError(
          "HLS playback error: " + data.details
        );

      }

    });

    window.addEventListener(
      "pagehide",
      () => hls.destroy(),
      { once: true }
    );

  }

  else {

    throw new Error(
      "HLS is not supported in this browser"
    );

  }

}


// ==========================================
// EXTERNAL IFRAME
// ==========================================

else if (type === "iframe") {

  if (!validVideoUrl(url)) {
    throw new Error("Invalid embed URL");
  }

  const iframe = document.createElement("iframe");

  iframe.className = "video-frame";

  iframe.title =
    room.title || "External Video";

  iframe.allow =
    "autoplay; fullscreen; picture-in-picture; encrypted-media";

  iframe.allowFullscreen = true;

  iframe.referrerPolicy =
    "strict-origin-when-cross-origin";

  iframe.src = url;

  videoStage.appendChild(iframe);

}


// ==========================================
// UNSUPPORTED
// ==========================================

else {

  throw new Error(
    "Unsupported source type: " + type
  );

}


      loadingState.classList.add("hidden");

    }

    catch (error) {

      showError(
        "Cannot open video: " + error.message
      );

    }

  }


  loadVideo();




/* ==========================================
   YOUTUBE1 + YOUTUBE2 + YOUTUBE3
   AUTOMATIC LIVE SOURCE UPDATES
========================================== */

if (
  roomId === "Youtube1" ||
  roomId === "Youtube2" ||
  roomId === "Youtube3"
) {

  let checkingSource = false;

  async function checkAutoYoutubeSource() {

    if (checkingSource) return;

    checkingSource = true;

    try {

      const response = await fetch(
        "/api/virtual-live/rooms/" +
        encodeURIComponent(roomId),
        { cache: "no-store" }
      );

      if (!response.ok) return;

const room = await response.json();

applyLinkedLiveRoom(room);

if (
  !lg("linkedGiftModal")
    .classList.contains("hidden") &&
  !lgSending
) {
  loadLgCatalog();
}

const nextId =
  room.status === "live"
    ? String(room.videoId || "")
    : "";

      // Refresh only when live source changes.
      if (
        nextId !== activeAutoYoutubeVideoId
      ) {

        await loadVideo();

      }

    } catch (error) {

      console.warn(
        "[AUTO YOUTUBE SOURCE]",
        error
      );

    } finally {

      checkingSource = false;

    }

  }

  // Each room listens to its own socket event.

const statusEvent =
  roomId === "Youtube1"
    ? "virtual-live:yt1-status"
    : roomId === "Youtube2"
      ? "virtual-live:yt2-status"
      : "virtual-live:yt3-status";


  socket.on(
    statusEvent,
    checkAutoYoutubeSource
  );

  // Recover from missed socket updates.
  const sourceTimer = setInterval(
    checkAutoYoutubeSource,
    60000
  );

  // Check again when returning to this page.
  document.addEventListener(
    "visibilitychange",
    () => {

      if (!document.hidden) {
        checkAutoYoutubeSource();
      }

    }
  );

  window.addEventListener(
    "pagehide",
    () => {

      clearInterval(sourceTimer);

      socket.off(
        statusEvent,
        checkAutoYoutubeSource
      );

    }
  );

}



  // Leave Room

  window.addEventListener("pagehide", () => {

    socket.emit("virtual-live:leave");

  });

})();

</script>
