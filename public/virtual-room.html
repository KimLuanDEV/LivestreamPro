
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#FAF6E9">

<title>Virtual Live - Livestream Pro</title>

<style>
/* LIVESTREAM PRO — VIRTUAL LIVE / CHAMPAGNE GOLD & WHITE */
:root {
  color-scheme: light;
  --bg: #FAF6E9;
  --white: #FFFFFF;
  --cream: #FCFAF5;
  --gold: #947025;
  --dark-gold: #70531D;
  --text: #29251D;
  --muted: #766D5B;
  --line: #EAE0C8;
  --champagne: #F8EBC9;
  --gradient: linear-gradient(135deg, #F5E4B5, #E3C47C);
}

/* 01. Page and safe areas */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
}
body { overflow: hidden; }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { cursor: not-allowed; }
.hidden { display: none !important; }
.page {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  background: #000;
}

/* 02. Room header */
.header {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 9px;
  padding: calc(9px + env(safe-area-inset-top, 0px)) 12px 9px;
  background: linear-gradient(120deg, #FFFDF7, #F8EBC9);
  border-bottom: 1px solid var(--line);
}
.back {
  display: grid;
  place-items: center;
  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--white);
  color: var(--gold);
  font-size: 29px;
  line-height: 1;
}
.avatar, .linked-owner img {
  display: block;
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 2px solid var(--white);
  border-radius: 50%;
  object-fit: cover;
  background: var(--champagne);
  box-shadow: 0 0 0 1px #DFCFAE;
}
.info { flex: 1; min-width: 0; }
.room-title {
  color: var(--text);
  font-size: 13px;
  font-weight: 750;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.room-meta { margin-top: 3px; color: var(--muted); font-size: 11px; }
.live-badge {
  flex-shrink: 0;
  padding: 5px 8px;
  border-radius: 7px;
  background: #9e212a;
  color: #fff;
  font-size: 10px;
  font-weight: 750;
}

/* 03. Video: retain original aspect ratio and playback area */
.video-stage {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
}
.video-frame {
  display: block;
  width: 100%;
  max-height: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  background: #000;
}
.video-native {
  display: block;
  width: 100%;
  max-height: 100%;
  object-fit: contain;
  background: #000;
}
.loading {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--cream);
  color: var(--muted);
  text-align: center;
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* 04. Linked gift recipient toolbar */
.footer.linked-live-footer {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 13px calc(10px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: var(--white);
}
.linked-owner { display: flex; align-items: center; gap: 10px; min-width: 0; }
.linked-owner-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.linked-owner-info small { color: var(--gold); font-size: 10px; font-weight: 650; }
.linked-owner-info strong {
  color: var(--text);
  font-size: 14px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.linked-owner-info span { color: var(--muted); font-size: 10px; }
.linked-gift-btn {
  display: grid;
  place-items: center;
  flex: 0 0 46px;
  width: 46px;
  height: 46px;
  padding: 0;
  border: 1px solid #DFC382;
  border-radius: 13px;
  background: var(--gradient);
  color: #4D3915;
}
.linked-gift-btn svg { width: 25px; height: 25px; }
.linked-gift-btn:disabled { opacity: .4; }

/* 05. Gift bottom sheet */
.lg-modal {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.lg-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.20); }
.lg-sheet {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: min(100%, 430px);
  height: 52vh;
  height: 52dvh;
  min-height: 0;
  max-height: calc(100% - env(safe-area-inset-top, 0px));
  padding: 9px 10px calc(10px + env(safe-area-inset-bottom, 0px));
  gap: 6px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
  background: var(--bg);
  box-shadow: 0 -8px 30px rgba(52,43,25,.15);
  animation: lgSlideUp .22s ease-out;
}
@keyframes lgSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.lg-handle { flex-shrink: 0; width: 34px; height: 4px; margin: 0 auto 2px; border-radius: 99px; background: #D6C7A7; }
.lg-header { display: flex; flex-shrink: 0; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 5px; border-bottom: 1px solid var(--line); }
.lg-header h3 { margin: 0; font-size: 17px; font-weight: 750; }
.lg-header small { display: none; }
.lg-close { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 9px; background: var(--white); color: var(--gold); font-size: 23px; }
.lg-recipient { flex-shrink: 0; padding: 1px 4px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.lg-recipient strong { color: var(--dark-gold); font-weight: 750; }
.lg-recipient small { display: block; margin-top: 2px; font-size: 10px; color: var(--muted); }

/* 06. Scrollable gift collection */
.lg-grid {
  flex: 1 1 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: min-content;
  align-content: start;
  min-height: 0;
  gap: 5px;
  padding: 3px 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.lg-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  gap: 3px;
  padding: 5px 3px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--white);
}
.lg-item.active { background: var(--champagne); border-color: #C9A75D; box-shadow: inset 0 0 0 1px #C9A75D; }
.lg-item .lg-gift-image { display: block; width: 100%; max-width: 64px; height: 58px; flex-shrink: 0; object-fit: contain; pointer-events: none; user-select: none; }
.lg-item strong { display: block; width: 100%; color: var(--text); font-size: 10px; font-weight: 600; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lg-item small { color: var(--dark-gold); font-size: 10px; font-weight: 700; white-space: nowrap; }

/* 07. Combo, feedback and payment controls */
.lg-combo { flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 6px 0 2px; border-top: 1px solid var(--line); }
.lg-combo button { min-height: 32px; padding: 0 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--white); color: var(--muted); font-size: 11px; font-weight: 650; }
.lg-combo button.active { background: var(--champagne); border-color: #C9A75D; color: var(--dark-gold); }
.lg-message { flex-shrink: 0; margin: 0; padding: 3px 5px; color: var(--dark-gold); font-size: 11px; line-height: 1.4; text-align: center; overflow-wrap: anywhere; max-height: 65px; overflow-y: auto; }
.lg-message:empty { display: none; }
.lg-bottom { display: flex; flex-shrink: 0; align-items: center; gap: 8px; min-height: 44px; padding: 2px 0; }
.lg-wallet { display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 40%; min-height: 39px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
.lg-wallet span { flex-shrink: 0; font-size: 14px; }
#lgBalance { min-width: 0; color: var(--dark-gold); font-size: 12px; font-weight: 750; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.lg-total { display: flex; flex: 1; min-width: 0; flex-direction: column; align-items: flex-end; gap: 1px; }
.lg-total span { color: var(--muted); font-size: 9px; }
#lgTotal { color: var(--dark-gold); font-size: 12px; font-weight: 750; overflow-wrap: anywhere; text-align: right; }
.lg-send { flex: 0 0 auto; min-width: 76px; max-width: 118px; min-height: 40px; padding: 6px 10px; border: 1px solid #DFC382; border-radius: 11px; background: var(--gradient); color: #4D3915; font-size: 10px; font-weight: 800; overflow-wrap: anywhere; }
.lg-send:disabled { background: #EAE5D9; color: #766D5B; border-color: var(--line); }

/* 08. Realtime gift notification */
.lg-effect {
  position: fixed;
  left: 50%;
  top: 22%;
  transform: translateX(-50%);
  z-index: 11000;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 7px;
  width: min(250px, 82vw);
  padding: 15px;
  border: 1px solid #DFC382;
  border-radius: 18px;
  background: #FFFDF7;
  color: var(--dark-gold);
  box-shadow: 0 8px 28px rgba(52,43,25,.18);
  pointer-events: none;
  animation: lgGiftPop .4s ease-out;
}
.lg-effect .lg-effect-image { width: 80px; height: 80px; object-fit: contain; pointer-events: none; user-select: none; }
.lg-effect strong { max-width: 100%; font-size: 15px; overflow-wrap: anywhere; text-align: center; }
.lg-effect small { max-width: 100%; color: var(--muted); font-size: 12px; text-align: center; overflow-wrap: anywhere; }
@keyframes lgGiftPop { from { opacity: 0; transform: translate(-50%, 20px) scale(.9); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

/* 09. Responsive and accessibility */
@media (max-width: 380px) {
  .header { gap: 7px; padding-left: 9px; padding-right: 9px; }
  .avatar { width: 37px; height: 37px; }
  .lg-sheet { padding-left: 7px; padding-right: 7px; }
  .lg-item .lg-gift-image { max-width: 57px; height: 48px; }
  .lg-item strong, .lg-item small { font-size: 9px; }
  .lg-send { min-width: 66px; max-width: 99px; padding: 6px 7px; }
  .lg-wallet { padding: 6px; }
}
@media (max-height: 600px) {
  .lg-sheet { height: 70vh; height: 70dvh; }
}
@media (prefers-reduced-motion: reduce) {
  .lg-sheet, .lg-effect { animation: none; }
}
</style>

</head>

<body>

<div class="page">

  <header class="header">

    <button class="back" id="backBtn" type="button" aria-label="Back to lobby">
      ‹
    </button>

    <img
      id="roomAvatar"
      class="avatar"
      src="/icons/icon-192.png"
      alt="Room Avatar"
    >

    <div class="info">

      <div class="room-title" id="roomTitle">
        VIRTUAL LIVE
      </div>

      <div class="room-meta">

        <span id="viewerCount">0</span>
        viewers

      </div>

    </div>

    <span class="live-badge">
      ● LIVE
    </span>

  </header>


  <main class="video-stage" id="videoStage">

    <div class="loading" id="loadingState">
      Loading video...
    </div>

  </main>


<!-- ======================================
     LINKED LIVE - GIFT TOOLBAR
======================================= -->

<footer class="footer linked-live-footer">

  <div class="linked-owner">

    <img
      id="linkedOwnerAvatar"
      src="/icons/icon-192.png"
      alt="Gift recipient"
    >

    <div class="linked-owner-info">

      <small>Gift recipient</small>

      <strong id="linkedOwnerName">
        Not linked
      </strong>

      <span>External broadcast</span>

    </div>

  </div>

  <button
    type="button"
    id="linkedGiftBtn"
    class="linked-gift-btn"
    aria-label="Send a gift"
    disabled
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <rect x="3" y="8" width="18" height="4" rx="1"/>
      <path d="M5 12v9h14v-9M12 8v13"/>
      <path d="M12 8C2 8 5 0 9 3L12 8"/>
      <path d="M12 8C22 8 19 0 15 3L12 8"/>
    </svg>

  </button>

</footer>

</div>



<!-- ======================================
     LINKED LIVE - COMPACT GIFT PANEL V2.0
======================================= -->

<div
  id="linkedGiftModal"
  class="lg-modal hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="lgGiftTitle">

  <div
    id="lgBackdrop"
    class="lg-backdrop">
  </div>

  <div class="lg-sheet">

    <!-- HANDLE -->

    <div class="lg-handle"></div>

    <!-- HEADER -->

    <div class="lg-header">

      <h3 id="lgGiftTitle">
        Gifts
      </h3>

      <small>
        LIVE COLLECTION
      </small>

      <button
        type="button"
        id="lgClose"
        class="lg-close"
        aria-label="Close gifts">

        &times;

      </button>

    </div>

    <!-- GIFT RECIPIENT -->

    <div class="lg-recipient">

      To:
      <strong id="lgRecipient">---</strong>

      <small>
        App gift, not a YouTube donation.
      </small>

    </div>

    <!-- GIFT COLLECTION -->

    <div
      id="lgGiftList"
      class="lg-grid">
    </div>

    <!-- COMBO QUANTITY -->

    <div class="lg-combo">

      <button
        type="button"
        data-qty="1"
        class="active">
        ×1
      </button>

      <button
        type="button"
        data-qty="5">
        ×5
      </button>

      <button
        type="button"
        data-qty="10">
        ×10
      </button>

      <button
        type="button"
        data-qty="20">
        ×20
      </button>

      <button
        type="button"
        data-qty="50">
        ×50
      </button>

    </div>

    <!-- FEEDBACK -->

    <div
      id="lgMessage"
      class="lg-message"
      role="status">
    </div>

    <!-- COMPACT BOTTOM BAR -->

    <div class="lg-bottom">

      <!-- BALANCE -->

      <div
        class="lg-wallet"
        aria-label="My diamonds">

        <span>💎</span>

        <strong id="lgBalance">
          0
        </strong>

      </div>

      <!-- TOTAL -->

      <div class="lg-total">

        <span>TOTAL</span>

        <strong id="lgTotal">
          0 💎
        </strong>

      </div>

      <!-- SEND -->

      <button
        type="button"
        id="lgSend"
        class="lg-send"
        disabled>

        SEND

      </button>

    </div>

  </div>

</div>


<!-- REALTIME GIFT EFFECT -->

<div
  id="lgGiftEffect"
  class="lg-effect hidden"
  aria-live="polite"
>

 <img
  id="lgEffectIcon"
  class="lg-effect-image"
  alt="Gift"
  draggable="false"
>

  <strong id="lgEffectName"></strong>

  <small id="lgEffectText"></small>

</div>



<script src="/socket.io/socket.io.js"></script>
<!-- HLS PLAYER -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>

(() => {

  "use strict";

  const params = new URLSearchParams(location.search);

  const roomId = params.get("room") || "Youtube";

  let activeAutoYoutubeVideoId = null;

  const roomTitle =
    document.getElementById("roomTitle");

  const roomAvatar =
    document.getElementById("roomAvatar");

  const viewerCount =
    document.getElementById("viewerCount");

  const videoStage =
    document.getElementById("videoStage");

  const loadingState =
    document.getElementById("loadingState");


  // Back to Lobby

  document.getElementById("backBtn").onclick = () => {
    location.href = "/lobby.html";
  };


  // SOCKET

  const socket = io({
    transports: ["websocket", "polling"]
  });


  /* ==========================================
   LINKED LIVE - GIFT ENGINE
========================================== */

const lg = id => document.getElementById(id);

let lgOwner = null;
let lgCatalog = [];
let lgSelected = null;
let lgQuantity = 1;
let lgCoins = 0;
let lgEnabled = false;
let lgSending = false;
let lgJoined = false;
let lgSourceLive = false;
let lgEffectTimer = null;
let lgPending = null;

const lgFormat = value =>
  Number(value || 0).toLocaleString("en-US");


// Restore an unconfirmed transaction after reload.

const lgPendingKey =
  "lsp_linked_gift_pending_" + roomId;

try {

  lgPending = JSON.parse(
    sessionStorage.getItem(lgPendingKey) || "null"
  );

} catch {

  lgPending = null;

}


/* ==========================================
   LINKED ACCOUNT DISPLAY
========================================== */

function renderLinkedOwner(owner) {

  lgOwner = owner || null;

  lg("linkedOwnerName").textContent =
    owner?.name || "Not linked";

  lg("linkedOwnerAvatar").src =
    owner?.avatar || "/icons/icon-192.png";

  lg("lgRecipient").textContent =
    owner
      ? `${owner.name} (${owner.uid})`
      : "Unavailable";

  updateLinkedGiftButton();

}


lg("linkedOwnerAvatar").onerror = function() {

  this.onerror = null;

  this.src = "/icons/icon-192.png";

};


function updateLinkedGiftButton() {

  lg("linkedGiftBtn").disabled = !(
    socket.connected &&
    lgJoined &&
    (
      (lgOwner && lgSourceLive) ||
      lgPending
    )
  );

}


/* ==========================================
   COMPACT GIFT - SEND BUTTON STATE
========================================== */

function updateLgSend() {

  const btn = lg("lgSend");

  const total = lgSelected
    ? lgSelected.cost * lgQuantity
    : 0;

  /* UPDATE BALANCE */

  lg("lgBalance").textContent =
    lgFormat(lgCoins);

  /* UPDATE TOTAL */

  lg("lgTotal").textContent =
    `${lgFormat(total)} 💎`;

  /* SENDING */

  if (lgSending) {

    btn.disabled = true;
    btn.textContent = "SENDING...";

    return;

  }

  /* PENDING TRANSACTION */

  if (lgPending) {

    btn.disabled = !(
      socket.connected &&
      lgJoined
    );

    btn.textContent = "CHECK / RETRY";

    return;

  }

  /* GIFT UNAVAILABLE */

  if (!lgEnabled || !lgSourceLive) {

    btn.disabled = true;
    btn.textContent = "UNAVAILABLE";

    return;

  }

  /* NO SELECTED GIFT */

  if (!lgSelected) {

    btn.disabled = true;
    btn.textContent = "SELECT";

    return;

  }

  /* CHECK BALANCE */

  btn.disabled = !(
    socket.connected &&
    lgJoined &&
    lgCoins >= total
  );

  btn.textContent = lgCoins >= total
    ? "SEND"
    : "NOT ENOUGH";

}
/* ==========================================
   GIFT IMAGES
========================================== */

// Adjust this path if your gift assets
// are stored in another directory.

/* ==========================================
   GIFT IMAGES - SYNC BROADCAST SFU
========================================== */

const LG_GIFT_ASSET_PATH = "/assets/live-gifts/";

const LG_GIFT_FILES = {
  rose: "rose.webp",
  heart: "heart.webp",
  flower: "flower.webp",
  cake: "cake.webp",
  rocket: "rocket.webp",
  diamond: "diamond.webp",
  teddy: "teddy.webp",
  champagne: "champagne.webp",
  king: "crown.webp",
  car: "car.webp",
  sword: "sword.webp",
  pegasus: "pegasus.webp",
  phoenix: "phoenix.webp",
  dragon: "dragon.webp",
  castle: "castle.webp",
  yacht: "yacht.webp",
  supercar: "supercar.webp",
  palace: "palace.webp",
  celestialDragon: "celestial-dragon.webp",
  universe: "universe.webp"
};

function getLgGiftImage(giftId) {

  const file = Object.hasOwn(LG_GIFT_FILES, giftId)
    ? LG_GIFT_FILES[giftId]
    : "heart.webp";

  return LG_GIFT_ASSET_PATH + file;

}

/* ==========================================
   RENDER GIFT CATALOG
========================================== */

function renderLgCatalog() {

  const list = lg("lgGiftList");

  list.replaceChildren();

  for (const gift of lgCatalog) {

    const btn = document.createElement("button");

    btn.type = "button";

    btn.className = "lg-item";

    if (lgSelected?.id === gift.id) {

      btn.classList.add("active");

    }

const img = document.createElement("img");

img.className = "lg-gift-image";

img.src = getLgGiftImage(gift.id);

img.alt = gift.name;

img.loading = "lazy";

img.decoding = "async";

img.draggable = false;

img.onerror = function () {

  this.onerror = null;

  this.src = LG_GIFT_ASSET_PATH + "heart.webp";

};

    const name =
      document.createElement("strong");

    name.textContent = gift.name;


    const cost =
      document.createElement("small");

    cost.textContent =
      "💎 " + lgFormat(gift.cost);


    btn.append(img, name, cost);


    btn.onclick = () => {

      if (lgSending || lgPending) return;

      lgSelected = gift;

      list.querySelectorAll(".lg-item")
        .forEach(item =>
          item.classList.remove("active")
        );

      btn.classList.add("active");

      lg("lgMessage").textContent = "";

      updateLgSend();

    };

    list.appendChild(btn);

  }

}


/* ==========================================
   LOAD REAL SERVER CATALOG
========================================== */

function loadLgCatalog() {

  lgEnabled = false;

  updateLgSend();

  socket.timeout(8000).emit(

    "virtual-live:gift:catalog",

    { roomId },

    (error, reply) => {

      if (
        error ||
        !reply?.ok ||
        !socket.connected ||
        !lgJoined
      ) {

        lg("lgMessage").textContent =
          "Unable to load gifts. Please try again.";

        updateLgSend();

        return;

      }

      renderLinkedOwner(reply.owner);

      lgCatalog = Array.isArray(reply.gifts)
        ? reply.gifts
        : [];

      lgCoins = Number(reply.coins || 0);

      lgEnabled = Boolean(reply.enabled);

      lgSelected = lgCatalog.find(
        gift => gift.id === lgSelected?.id
      ) || lgCatalog[0] || null;


      if (lgPending) {

        lg("lgMessage").textContent =
          "An unconfirmed transaction exists. " +
          "Retry it to check the previous payment.";

      } else if (!reply.authenticated) {

        lg("lgMessage").textContent =
          "Please sign in to send gifts.";

      } else if (!lgEnabled) {

        lg("lgMessage").textContent =
          "Gifts are currently unavailable.";

      } else {

        lg("lgMessage").textContent = "";

      }


      renderLgCatalog();

      updateLgSend();

    }

  );

}


/* ==========================================
   OPEN / CLOSE GIFT PANEL
========================================== */

lg("linkedGiftBtn").onclick = () => {

  lg("linkedGiftModal")
    .classList.remove("hidden");

  loadLgCatalog();

};


function closeLinkedGiftModal() {

  lg("linkedGiftModal")
    .classList.add("hidden");

}


lg("lgClose").onclick =
  closeLinkedGiftModal;

lg("lgBackdrop").onclick =
  closeLinkedGiftModal;


/* ==========================================
   GIFT COMBO
========================================== */

document.querySelectorAll(
  ".lg-combo button"
).forEach(btn => {

  btn.onclick = () => {

    if (lgSending || lgPending) return;

    lgQuantity = Number(btn.dataset.qty);

    document.querySelectorAll(
      ".lg-combo button"
    ).forEach(item => {

      item.classList.toggle(
        "active",
        item === btn
      );

    });

    updateLgSend();

  };

});


/* ==========================================
   SEND REAL GIFT
========================================== */

lg("lgSend").onclick = () => {

  if (
    lgSending ||
    !socket.connected ||
    !lgJoined
  ) return;


  if (!lgPending) {

    if (
      !lgEnabled ||
      !lgSourceLive ||
      !lgSelected ||
      !lgOwner
    ) return;

    const total =
      lgSelected.cost * lgQuantity;

    if (lgCoins < total) return;


    lgPending = {

      roomId,

      giftId: lgSelected.id,

      quantity: lgQuantity,

      expectedOwnerUid: lgOwner.uid,

      expectedCost: total,

      requestId: crypto.randomUUID()

    };

  }


  // Save the same request ID for safe retries.

  try {

    sessionStorage.setItem(
      lgPendingKey,
      JSON.stringify(lgPending)
    );

  } catch {

    lgPending = null;

    lg("lgMessage").textContent =
      "Unable to secure transaction. Please retry.";

    updateLgSend();

    return;

  }


  lgSending = true;

  lg("lgMessage").textContent = "";

  updateLgSend();


  socket.timeout(10000).emit(

    "virtual-live:gift:send",

    lgPending,

    (error, reply) => {

      lgSending = false;


      // Do not create a new transaction ID
      // when the server response is lost.

      if (error || !reply) {

        lg("lgMessage").textContent =
          "Payment status unknown. " +
          "Retry to check the same transaction.";

        updateLgSend();

        return;

      }


      lgPending = null;

      sessionStorage.removeItem(lgPendingKey);


      if (!reply.ok) {

        lg("lgMessage").textContent =
          reply.error || "Unable to send gift.";

        updateLgSend();

        return;

      }


      lgCoins = Number(reply.coins || 0);

      lg("lgMessage").textContent =
        "Gift sent successfully!";

      updateLgSend();

      updateLinkedGiftButton();

    }

  );

};


/* ==========================================
   REALTIME WALLET UPDATE
========================================== */

socket.on("coin-update", data => {

  if (
    Number.isSafeInteger(
      Number(data?.coins)
    )
  ) {

    lgCoins = Number(data.coins);

    updateLgSend();

  }

});


/* ==========================================
   REALTIME GIFT EFFECT
========================================== */

socket.on("virtual-live:gift:new", data => {

  if (data?.roomId !== roomId) return;

const giftImage = lg("lgEffectIcon");

giftImage.onerror = function () {

  this.onerror = null;

  this.src = LG_GIFT_ASSET_PATH + "heart.webp";

};

giftImage.src = getLgGiftImage(data.giftId);

giftImage.alt = data.giftName || "Gift";

  lg("lgEffectName").textContent =
    data.donor || "Viewer";

  lg("lgEffectText").textContent =

    `Sent ${data.giftName} ×${data.quantity}` +
    ` · 💎 ${lgFormat(data.cost)}`;


  const effect = lg("lgGiftEffect");

  effect.classList.add("hidden");

  // Restart CSS animation.

  void effect.offsetWidth;

  effect.classList.remove("hidden");


  clearTimeout(lgEffectTimer);

  lgEffectTimer = setTimeout(() => {

    effect.classList.add("hidden");

  }, 3500);

});


/* ==========================================
   CONNECTION PROTECTION
========================================== */

socket.on("disconnect", () => {

  lgJoined = false;

  lgEnabled = false;

  lg("lgMessage").textContent =
    "Connection lost. Reconnecting...";

  updateLinkedGiftButton();

  updateLgSend();

});


/* ==========================================
   LINKED LIVE SOURCE STATUS
========================================== */

function applyLinkedLiveRoom(room) {

  lgSourceLive = Boolean(
    room?.giftsEnabled &&
    room?.status === "live"
  );

  renderLinkedOwner(room?.linkedOwner);

  if (!lgSourceLive) {

    lgEnabled = false;

  }

  updateLgSend();

}

function joinRoom() {

  lgJoined = false;

  socket.timeout(8000).emit(

    "virtual-live:join",

    { roomId },

    (error, response) => {

      if (error || !response?.ok) {

        showError(
          "This virtual room is not available."
        );

        updateLinkedGiftButton();

        return;

      }

      lgJoined = true;

      updateLinkedGiftButton();

      if (
        !lg("linkedGiftModal")
          .classList.contains("hidden")
      ) {

        loadLgCatalog();

      }

    }

  );

}


  socket.on("connect", joinRoom);


  // Viewer Count

  socket.on("virtual-live:counts", counts => {

    viewerCount.textContent =
      String(counts?.[roomId] ?? 0);

  });


  // Error

  function showError(message) {

    loadingState.classList.remove("hidden");

    loadingState.textContent = message;

  }


  // LOAD VIDEO

  async function loadVideo() {

    try {

      const response = await fetch(
        "/api/virtual-live/rooms/" +
        encodeURIComponent(roomId),
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("Room not found");
      }

const room = await response.json();

applyLinkedLiveRoom(room);

roomTitle.textContent =
  room.title || roomId;

      roomAvatar.src =
        room.avatar || "/icons/icon-192.png";




/* ==========================================
   YOUTUBE1/2/3 - AUTOMATIC LIVE PLAYER
========================================== */

if (
  roomId === "Youtube1" ||
  roomId === "Youtube2" ||
  roomId === "Youtube3"
) {


  const isLive =
    room.status === "live" &&
    /^[a-zA-Z0-9_-]{11}$/.test(
      String(room.videoId || "")
    );

  const badge =
    document.querySelector(".live-badge");

  if (badge) {
    badge.textContent = isLive
      ? "● LIVE"
      : "OFFLINE";

    badge.style.background = isLive
      ? "#9e212a"
      : "#444";
  }

  // Remove previous player when source changes.
  videoStage
    .querySelectorAll("iframe, video")
    .forEach(player => player.remove());

activeAutoYoutubeVideoId = isLive
  ? room.videoId
  : "";

  if (!isLive) {

    const message =
      room.status === "unconfigured"
        ? "YouTube API is not configured."
        : room.status === "error"
          ? "Unable to check livestream status."
          : "Channel is offline. Waiting for the next livestream...";

    showError(message);

    return;
  }

}





/* ==========================================
   VIRTUAL LIVE - UNIVERSAL VIDEO PLAYER
   YOUTUBE / MP4 / HLS / IFRAME
========================================== */

const type = String(room.type || "").toLowerCase();

const url = String(room.url || "").trim();

function validVideoUrl(value) {

  try {

    const parsed = new URL(value, location.origin);

    return (
      parsed.protocol === "https:" ||
      (
        parsed.protocol === "http:" &&
        parsed.origin === location.origin
      )
    );

  } catch {

    return false;

  }

}

function makeVideo() {

  const video = document.createElement("video");

  video.className = "video-native";

  video.controls = true;
  video.autoplay = true;
  video.playsInline = true;

  video.preload = "auto";

  video.addEventListener("error", () => {
    showError("Unable to load video source.");
  });

  videoStage.appendChild(video);

  return video;

}



/* ==========================================
   VIRTUAL LIVE - VIDEO TIME SYNC
========================================== */

function enableVirtualLiveSync(video, room) {

  if (!room.sync || !room.startedAt) {
    return;
  }

  // Ước lượng chênh lệch đồng hồ client/server
  const clockOffset =
    Number(room.serverNow) - Date.now();

  let syncTimer = null;

  function getTargetTime() {

    const duration = video.duration;

    if (
      !Number.isFinite(duration) ||
      duration <= 0
    ) {
      return null;
    }

    const serverTime =
      Date.now() + clockOffset;

    const elapsed = Math.max(
      0,
      (serverTime - room.startedAt) / 1000
    );

    // Phát lặp liên tục theo đồng hồ server
    if (room.loop) {
      return elapsed % duration;
    }

    return Math.min(
      elapsed,
      Math.max(0, duration - 0.1)
    );

  }

  function syncPlayback(force = false) {

    const target = getTargetTime();

    if (target === null) return;

    const duration = video.duration;

    const diff = Math.abs(
      video.currentTime - target
    );

    // Tính khoảng cách khi video lặp
    const circularDiff = room.loop
      ? Math.min(diff, duration - diff)
      : diff;

    if (force || circularDiff > 2) {

      try {
        video.currentTime = target;
      } catch (error) {
        console.warn("Video sync failed", error);
      }

    }

    // Đảm bảo video tiếp tục chạy
    if (video.paused && !video.ended) {

      attemptPlay(video);

    }

  }

  function startSync() {

    syncPlayback(true);

    if (syncTimer) {
      clearInterval(syncTimer);
    }

    // Kiểm tra sai lệch sau mỗi 5 giây
    syncTimer = setInterval(() => {

      if (document.hidden) return;

      syncPlayback();

    }, 5000);

  }

  video.addEventListener(
    "loadedmetadata",
    startSync,
    { once: true }
  );

  video.addEventListener("ended", () => {

    if (room.loop) {
      syncPlayback(true);
    }

  });

  document.addEventListener(
    "visibilitychange",
    () => {

      if (!document.hidden) {
        syncPlayback(true);
      }

    }
  );

  window.addEventListener(
    "pagehide",
    () => {

      if (syncTimer) {
        clearInterval(syncTimer);
      }

    },
    { once: true }
  );

}



function attemptPlay(video) {

  video.play().catch(() => {

    // Một số trình duyệt chỉ cho autoplay khi mute.

    video.muted = true;

    video.play().catch(() => {

      // Người xem có thể bấm Play thủ công.

    });

  });

}


// ==========================================
// YOUTUBE
// ==========================================

if (type === "youtube") {

  const videoId = String(room.videoId || "");

  if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    throw new Error("Invalid YouTube ID");
  }

  const iframe = document.createElement("iframe");

  iframe.className = "video-frame";

  iframe.title = room.title || "YouTube";

  iframe.allow =
    "autoplay; encrypted-media; fullscreen; picture-in-picture";

  iframe.allowFullscreen = true;

  iframe.referrerPolicy =
    "strict-origin-when-cross-origin";

  iframe.src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(videoId) +
    "?autoplay=1&playsinline=1&rel=0";

  videoStage.appendChild(iframe);

}


// ==========================================
// MP4 / WEBM
// ==========================================


else if (type === "mp4") {

  if (!validVideoUrl(url)) {
    throw new Error("Invalid video URL");
  }

  const video = makeVideo();

  video.loop = Boolean(room.loop);

  // Không cho điều khiển thời gian phát
  // khi phòng đang ở chế độ LIVE SYNC
  if (room.sync) {

    video.controls = false;

  }

  video.src = url;

  // Bật đồng bộ theo server
  enableVirtualLiveSync(video, room);

  // Autoplay nếu trình duyệt cho phép
  attemptPlay(video);

}



// ==========================================
// HLS - M3U8 LIVE STREAM
// ==========================================

else if (type === "hls") {

  if (!validVideoUrl(url)) {
    throw new Error("Invalid HLS URL");
  }

  const video = makeVideo();

  // Safari / iOS Native HLS
  if (
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src = url;

    attemptPlay(video);

  }

  // Chrome / Android / Edge
  else if (
    window.Hls &&
    Hls.isSupported()
  ) {

    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true
    });

    hls.loadSource(url);

    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {

      attemptPlay(video);

    });

    hls.on(Hls.Events.ERROR, (_, data) => {

      if (data.fatal) {

        showError(
          "HLS playback error: " + data.details
        );

      }

    });

    window.addEventListener(
      "pagehide",
      () => hls.destroy(),
      { once: true }
    );

  }

  else {

    throw new Error(
      "HLS is not supported in this browser"
    );

  }

}


// ==========================================
// EXTERNAL IFRAME
// ==========================================

else if (type === "iframe") {

  if (!validVideoUrl(url)) {
    throw new Error("Invalid embed URL");
  }

  const iframe = document.createElement("iframe");

  iframe.className = "video-frame";

  iframe.title =
    room.title || "External Video";

  iframe.allow =
    "autoplay; fullscreen; picture-in-picture; encrypted-media";

  iframe.allowFullscreen = true;

  iframe.referrerPolicy =
    "strict-origin-when-cross-origin";

  iframe.src = url;

  videoStage.appendChild(iframe);

}


// ==========================================
// UNSUPPORTED
// ==========================================

else {

  throw new Error(
    "Unsupported source type: " + type
  );

}


      loadingState.classList.add("hidden");

    }

    catch (error) {

      showError(
        "Cannot open video: " + error.message
      );

    }

  }


  loadVideo();




/* ==========================================
   YOUTUBE1 + YOUTUBE2 + YOUTUBE3
   AUTOMATIC LIVE SOURCE UPDATES
========================================== */

if (
  roomId === "Youtube1" ||
  roomId === "Youtube2" ||
  roomId === "Youtube3"
) {

  let checkingSource = false;

  async function checkAutoYoutubeSource() {

    if (checkingSource) return;

    checkingSource = true;

    try {

      const response = await fetch(
        "/api/virtual-live/rooms/" +
        encodeURIComponent(roomId),
        { cache: "no-store" }
      );

      if (!response.ok) return;

const room = await response.json();

applyLinkedLiveRoom(room);

if (
  !lg("linkedGiftModal")
    .classList.contains("hidden") &&
  !lgSending
) {
  loadLgCatalog();
}

const nextId =
  room.status === "live"
    ? String(room.videoId || "")
    : "";

      // Refresh only when live source changes.
      if (
        nextId !== activeAutoYoutubeVideoId
      ) {

        await loadVideo();

      }

    } catch (error) {

      console.warn(
        "[AUTO YOUTUBE SOURCE]",
        error
      );

    } finally {

      checkingSource = false;

    }

  }

  // Each room listens to its own socket event.

const statusEvent =
  roomId === "Youtube1"
    ? "virtual-live:yt1-status"
    : roomId === "Youtube2"
      ? "virtual-live:yt2-status"
      : "virtual-live:yt3-status";


  socket.on(
    statusEvent,
    checkAutoYoutubeSource
  );

  // Recover from missed socket updates.
  const sourceTimer = setInterval(
    checkAutoYoutubeSource,
    60000
  );

  // Check again when returning to this page.
  document.addEventListener(
    "visibilitychange",
    () => {

      if (!document.hidden) {
        checkAutoYoutubeSource();
      }

    }
  );

  window.addEventListener(
    "pagehide",
    () => {

      clearInterval(sourceTimer);

      socket.off(
        statusEvent,
        checkAutoYoutubeSource
      );

    }
  );

}



  // Leave Room

  window.addEventListener("pagehide", () => {

    socket.emit("virtual-live:leave");

  });

})();

</script>
