
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#080808">

<title>Virtual Live - Livestream Pro</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #050506;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
}

.page {
  display: flex;
  flex-direction: column;

  width: 100%;
  max-width: 650px;

  height: 100vh;
  height: 100dvh;

  margin: auto;

  background: #080808;
}

/* HEADER */

.header {
  display: flex;
  align-items: center;
  gap: 12px;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    12px;

  background: #111114;

  border-bottom: 1px solid #6c522a;
}

.back {
  width: 40px;
  height: 40px;

  border: 1px solid #997545;
  border-radius: 12px;

  background: #242019;
  color: #f5d59a;

  font-size: 25px;
  cursor: pointer;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;

  object-fit: cover;

  border: 2px solid #b9955c;
}

.info {
  flex: 1;
  min-width: 0;
}

.room-title {
  color: #f1d6a7;

  font-size: 13px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.room-meta {
  margin-top: 5px;
  font-size: 11px;
  color: #d3c1a3;
}

.live-badge {
  padding: 7px 9px;

  border-radius: 8px;

  background: #9e212a;
  color: #fff;

  font-size: 10px;
  font-weight: bold;
}

/* VIDEO */

.video-stage {
  position: relative;

  flex: 1;
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
}

.video-frame {
  display: block;

  width: 100%;
  max-height: 100%;

  aspect-ratio: 16 / 9;

  border: none;
  background: #000;
}

.video-native {
  display: block;
  width: 100%;
  max-height: 100%;
  background: #000;
}

.loading {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: #08080b;

  color: #e8cca2;

  text-align: center;
  font-size: 14px;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}

/* FOOTER */

.footer {
  padding:
    14px
    15px
    calc(18px + env(safe-area-inset-bottom));

  background: #111114;

  border-top: 1px solid #6c522a;

  color: #aaa;

  font-size: 12px;
  text-align: center;
}

</style>

</head>

<body>

<div class="page">

  <header class="header">

    <button class="back" id="backBtn">
      ‹
    </button>

    <img
      id="roomAvatar"
      class="avatar"
      src="/icons/icon-192.png"
      alt="Room Avatar"
    >

    <div class="info">

      <div class="room-title" id="roomTitle">
        VIRTUAL LIVE
      </div>

      <div class="room-meta">

        <span id="viewerCount">0</span>
        viewers watching

      </div>

    </div>

    <span class="live-badge">
      ● LIVE
    </span>

  </header>


  <main class="video-stage" id="videoStage">

    <div class="loading" id="loadingState">
      Loading video...
    </div>

  </main>


  <footer class="footer">

    VIRTUAL LIVE ROOM

  </footer>

</div>


<script src="/socket.io/socket.io.js"></script>
<!-- HLS PLAYER -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>

(() => {

  "use strict";

  const params = new URLSearchParams(location.search);

  const roomId = params.get("room") || "Youtube";

  let activeAutoYoutubeVideoId = null;

  const roomTitle =
    document.getElementById("roomTitle");

  const roomAvatar =
    document.getElementById("roomAvatar");

  const viewerCount =
    document.getElementById("viewerCount");

  const videoStage =
    document.getElementById("videoStage");

  const loadingState =
    document.getElementById("loadingState");


  // Back to Lobby

  document.getElementById("backBtn").onclick = () => {
    location.href = "/lobby.html";
  };


  // SOCKET

  const socket = io({
    transports: ["websocket", "polling"]
  });


  function joinRoom() {

    socket.emit(
      "virtual-live:join",
      { roomId },
      response => {

        if (!response?.ok) {

          showError(
            "This virtual room is not available."
          );

        }

      }
    );

  }


  socket.on("connect", joinRoom);


  // Viewer Count

  socket.on("virtual-live:counts", counts => {

    viewerCount.textContent =
      String(counts?.[roomId] ?? 0);

  });


  // Error

  function showError(message) {

    loadingState.classList.remove("hidden");

    loadingState.textContent = message;

  }


  // LOAD VIDEO

  async function loadVideo() {

    try {

      const response = await fetch(
        "/api/virtual-live/rooms/" +
        encodeURIComponent(roomId),
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("Room not found");
      }

      const room = await response.json();

      roomTitle.textContent =
        room.title || roomId;

      roomAvatar.src =
        room.avatar || "/icons/icon-192.png";



/* ==========================================
   YOUTUBE3 - AUTOMATIC LIVE PLAYER
========================================== */

if (
  roomId === "Youtube2" ||
  roomId === "Youtube3"
) {

  const isLive =
    room.status === "live" &&
    /^[a-zA-Z0-9_-]{11}$/.test(
      String(room.videoId || "")
    );

  const badge =
    document.querySelector(".live-badge");

  if (badge) {
    badge.textContent = isLive
      ? "● LIVE"
      : "OFFLINE";

    badge.style.background = isLive
      ? "#9e212a"
      : "#444";
  }

  // Remove previous player when source changes.
  videoStage
    .querySelectorAll("iframe, video")
    .forEach(player => player.remove());

activeAutoYoutubeVideoId = isLive
  ? room.videoId
  : "";

  if (!isLive) {

    const message =
      room.status === "unconfigured"
        ? "YouTube API is not configured."
        : room.status === "error"
          ? "Unable to check livestream status."
          : "Channel is offline. Waiting for the next livestream...";

    showError(message);

    return;
  }

}





/* ==========================================
   VIRTUAL LIVE - UNIVERSAL VIDEO PLAYER
   YOUTUBE / MP4 / HLS / IFRAME
========================================== */

const type = String(room.type || "").toLowerCase();

const url = String(room.url || "").trim();

function validVideoUrl(value) {

  try {

    const parsed = new URL(value, location.origin);

    return (
      parsed.protocol === "https:" ||
      (
        parsed.protocol === "http:" &&
        parsed.origin === location.origin
      )
    );

  } catch {

    return false;

  }

}

function makeVideo() {

  const video = document.createElement("video");

  video.className = "video-native";

  video.controls = true;
  video.autoplay = true;
  video.playsInline = true;

  video.preload = "auto";

  video.addEventListener("error", () => {
    showError("Unable to load video source.");
  });

  videoStage.appendChild(video);

  return video;

}



/* ==========================================
   VIRTUAL LIVE - VIDEO TIME SYNC
========================================== */

function enableVirtualLiveSync(video, room) {

  if (!room.sync || !room.startedAt) {
    return;
  }

  // Ước lượng chênh lệch đồng hồ client/server
  const clockOffset =
    Number(room.serverNow) - Date.now();

  let syncTimer = null;

  function getTargetTime() {

    const duration = video.duration;

    if (
      !Number.isFinite(duration) ||
      duration <= 0
    ) {
      return null;
    }

    const serverTime =
      Date.now() + clockOffset;

    const elapsed = Math.max(
      0,
      (serverTime - room.startedAt) / 1000
    );

    // Phát lặp liên tục theo đồng hồ server
    if (room.loop) {
      return elapsed % duration;
    }

    return Math.min(
      elapsed,
      Math.max(0, duration - 0.1)
    );

  }

  function syncPlayback(force = false) {

    const target = getTargetTime();

    if (target === null) return;

    const duration = video.duration;

    const diff = Math.abs(
      video.currentTime - target
    );

    // Tính khoảng cách khi video lặp
    const circularDiff = room.loop
      ? Math.min(diff, duration - diff)
      : diff;

    if (force || circularDiff > 2) {

      try {
        video.currentTime = target;
      } catch (error) {
        console.warn("Video sync failed", error);
      }

    }

    // Đảm bảo video tiếp tục chạy
    if (video.paused && !video.ended) {

      attemptPlay(video);

    }

  }

  function startSync() {

    syncPlayback(true);

    if (syncTimer) {
      clearInterval(syncTimer);
    }

    // Kiểm tra sai lệch sau mỗi 5 giây
    syncTimer = setInterval(() => {

      if (document.hidden) return;

      syncPlayback();

    }, 5000);

  }

  video.addEventListener(
    "loadedmetadata",
    startSync,
    { once: true }
  );

  video.addEventListener("ended", () => {

    if (room.loop) {
      syncPlayback(true);
    }

  });

  document.addEventListener(
    "visibilitychange",
    () => {

      if (!document.hidden) {
        syncPlayback(true);
      }

    }
  );

  window.addEventListener(
    "pagehide",
    () => {

      if (syncTimer) {
        clearInterval(syncTimer);
      }

    },
    { once: true }
  );

}



function attemptPlay(video) {

  video.play().catch(() => {

    // Một số trình duyệt chỉ cho autoplay khi mute.

    video.muted = true;

    video.play().catch(() => {

      // Người xem có thể bấm Play thủ công.

    });

  });

}


// ==========================================
// YOUTUBE
// ==========================================

if (type === "youtube") {

  const videoId = String(room.videoId || "");

  if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    throw new Error("Invalid YouTube ID");
  }

  const iframe = document.createElement("iframe");

  iframe.className = "video-frame";

  iframe.title = room.title || "YouTube";

  iframe.allow =
    "autoplay; encrypted-media; fullscreen; picture-in-picture";

  iframe.allowFullscreen = true;

  iframe.referrerPolicy =
    "strict-origin-when-cross-origin";

  iframe.src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(videoId) +
    "?autoplay=1&playsinline=1&rel=0";

  videoStage.appendChild(iframe);

}


// ==========================================
// MP4 / WEBM
// ==========================================


else if (type === "mp4") {

  if (!validVideoUrl(url)) {
    throw new Error("Invalid video URL");
  }

  const video = makeVideo();

  video.loop = Boolean(room.loop);

  // Không cho điều khiển thời gian phát
  // khi phòng đang ở chế độ LIVE SYNC
  if (room.sync) {

    video.controls = false;

  }

  video.src = url;

  // Bật đồng bộ theo server
  enableVirtualLiveSync(video, room);

  // Autoplay nếu trình duyệt cho phép
  attemptPlay(video);

}



// ==========================================
// HLS - M3U8 LIVE STREAM
// ==========================================

else if (type === "hls") {

  if (!validVideoUrl(url)) {
    throw new Error("Invalid HLS URL");
  }

  const video = makeVideo();

  // Safari / iOS Native HLS
  if (
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src = url;

    attemptPlay(video);

  }

  // Chrome / Android / Edge
  else if (
    window.Hls &&
    Hls.isSupported()
  ) {

    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true
    });

    hls.loadSource(url);

    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {

      attemptPlay(video);

    });

    hls.on(Hls.Events.ERROR, (_, data) => {

      if (data.fatal) {

        showError(
          "HLS playback error: " + data.details
        );

      }

    });

    window.addEventListener(
      "pagehide",
      () => hls.destroy(),
      { once: true }
    );

  }

  else {

    throw new Error(
      "HLS is not supported in this browser"
    );

  }

}


// ==========================================
// EXTERNAL IFRAME
// ==========================================

else if (type === "iframe") {

  if (!validVideoUrl(url)) {
    throw new Error("Invalid embed URL");
  }

  const iframe = document.createElement("iframe");

  iframe.className = "video-frame";

  iframe.title =
    room.title || "External Video";

  iframe.allow =
    "autoplay; fullscreen; picture-in-picture; encrypted-media";

  iframe.allowFullscreen = true;

  iframe.referrerPolicy =
    "strict-origin-when-cross-origin";

  iframe.src = url;

  videoStage.appendChild(iframe);

}


// ==========================================
// UNSUPPORTED
// ==========================================

else {

  throw new Error(
    "Unsupported source type: " + type
  );

}


      loadingState.classList.add("hidden");

    }

    catch (error) {

      showError(
        "Cannot open video: " + error.message
      );

    }

  }


  loadVideo();



/* ==========================================
   YOUTUBE2 + YOUTUBE3
   AUTOMATIC LIVE SOURCE UPDATES
========================================== */

if (
  roomId === "Youtube2" ||
  roomId === "Youtube3"
) {

  let checkingSource = false;

  async function checkAutoYoutubeSource() {

    if (checkingSource) return;

    checkingSource = true;

    try {

      const response = await fetch(
        "/api/virtual-live/rooms/" +
        encodeURIComponent(roomId),
        { cache: "no-store" }
      );

      if (!response.ok) return;

      const room = await response.json();

      const nextId =
        room.status === "live"
          ? String(room.videoId || "")
          : "";

      // Refresh only when live source changes.
      if (
        nextId !== activeAutoYoutubeVideoId
      ) {

        await loadVideo();

      }

    } catch (error) {

      console.warn(
        "[AUTO YOUTUBE SOURCE]",
        error
      );

    } finally {

      checkingSource = false;

    }

  }

  // Each room listens to its own socket event.
  const statusEvent =
    roomId === "Youtube2"
      ? "virtual-live:yt2-status"
      : "virtual-live:yt3-status";

  socket.on(
    statusEvent,
    checkAutoYoutubeSource
  );

  // Recover from missed socket updates.
  const sourceTimer = setInterval(
    checkAutoYoutubeSource,
    60000
  );

  // Check again when returning to this page.
  document.addEventListener(
    "visibilitychange",
    () => {

      if (!document.hidden) {
        checkAutoYoutubeSource();
      }

    }
  );

  window.addEventListener(
    "pagehide",
    () => {

      clearInterval(sourceTimer);

      socket.off(
        statusEvent,
        checkAutoYoutubeSource
      );

    }
  );

}



  // Leave Room

  window.addEventListener("pagehide", () => {

    socket.emit("virtual-live:leave");

  });

})();

</script>

</body>
</html>
